<title>職業版模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --soft:#EEF2F0; --ink:#13201C; --ink2:#3E4D48; --muted:#6A7873; --line:#DDE4E1;
  --accent:#0E6E62; --accent-soft:#DCEFEA; --good:#15803D; --bad:#C2410C; --warn:#A16207;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --card:#16201D; --soft:#1C2825; --ink:#E6EEEB; --ink2:#B7C5C0; --muted:#8B9B96; --line:#26332F;
  --accent:#4FC1AE; --accent-soft:#16342E; --good:#4ADE80; --bad:#FB923C; --warn:#FACC15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --card:#16201D; --soft:#1C2825; --ink:#E6EEEB; --ink2:#B7C5C0; --muted:#8B9B96; --line:#26332F;
  --accent:#4FC1AE; --accent-soft:#16342E; --good:#4ADE80; --bad:#FB923C; --warn:#FACC15; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC",-apple-system,"PingFang TC",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:14px}
header h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.tag{display:inline-block;font:600 11px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:6px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{margin:0 0 4px;font-size:18px;font-weight:900;text-wrap:balance}
.card h3{margin:16px 0 6px;font-size:15px}
.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.note{margin:10px 0 0;color:var(--muted);font-size:12.5px;line-height:1.65}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12px "IBM Plex Mono",monospace;color:#fff;background:var(--muted)}
.step.done .dot{background:var(--good)} .step.next .dot{background:var(--accent)} .step.wait .dot{background:var(--line);color:var(--muted)}
.step b{font-size:14.5px} .step p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.gl{display:grid;gap:10px}
.gl div{font-size:13.5px;color:var(--ink2)} .gl b{display:block;color:var(--ink);font-size:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right} .n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.grp td{background:var(--soft);color:var(--muted);font-size:11.5px;padding:4px 8px}
.s{font-size:11px;color:var(--muted);font-weight:400;line-height:1.3}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.lk{font:500 10.5px "Noto Sans TC",sans-serif;color:var(--muted);white-space:nowrap}
.lk.real{color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:6px 14px;font:600 13px "IBM Plex Mono",monospace;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.kpi{background:var(--soft);border-radius:10px;padding:10px}
.kpi span{display:block;font-size:11.5px;color:var(--muted)} .kpi b{font:600 19px "IBM Plex Mono",monospace}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:var(--warn)}
footer{color:var(--muted);font-size:12px;text-align:center}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr}.kpi:last-child{grid-column:span 2}}
</style>
<div class="wrap" id="app"></div>
<script>
const DATA = /*__DATA__*/null;
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const sgn = (x, d = 1) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
  const gb = (x) => (x == null ? "" : x > 0 ? "good" : x < 0 ? "bad" : "");
  const pp = (x, d = 1) => (x == null ? "–" : sgn(x * 100, d) + "%");
  const ppt = (x, d = 2) => (x == null ? "–" : sgn(x * 100, d));
  const SPN = {soccer: "足球", nfl: "NFL", mlb: "MLB", nhl: "NHL", nba: "NBA"};
  const sp = (k) => SPN[k] || k.toUpperCase();
  const MIN_N = 30;
  const luck = (m) => (!m || !m.n ? "" : m.n < MIN_N ? '<div class="lk">注太少</div>' : m.se == null || Math.abs(m.mean) < 2 * m.se ? '<div class="lk">還看不出</div>' : '<div class="lk real">看得出</div>');
  const store = {get: (k, d) => { try { const v = localStorage.getItem("pro_" + k); return v == null ? d : v; } catch (e) { return d; } },
                 set: (k, v) => { try { localStorage.setItem("pro_" + k, v); } catch (e) {} }};
  const ST = {thr: store.get("thr", "15")};

  const S1 = !!(DATA && DATA.soccer && DATA.soccer.test);
  const S2 = !!(DATA && DATA.us && ["mlb", "nfl", "nhl"].every((k) => DATA.us[k] && DATA.us[k].test));
  const S3 = !!(DATA && DATA.us && DATA.us.nba && DATA.us.nba.test);
  const STAGES = [
    ["done", "第 0 階段：CLV 追蹤＋資料檢查", "建立「搶到的價錢比收盤好多少」的成績單，檢查每一份資料齊不齊全，並先拿現有的東西量一次。", !S1],
    [S1 ? "done" : "next", "第 1 階段：足球比分模型", "不看賠率，只用比分、射門、賽程，自己預測兩隊各進幾球，算出獨贏、讓球、大小的盤口，再跟收盤比。", S1 && !S2],
    [S2 ? "done" : S1 ? "next" : "wait", "第 2 階段：NFL、MLB、NHL", "用公開的比賽細節資料（每一個 play、每一球的打席結果、射門品質）建各自的模型。", S2 && !S3],
    [S3 ? "done" : S2 ? "next" : "wait", "第 3 階段：NBA", "效率（每 100 回合得失分）、節奏、誰缺陣、背靠背。", S3],
    [S3 ? "next" : "wait", "第 4 階段：混合＋每日對照表", "跟市場、資金流向混合，每天出「我們的盤口 vs 莊家」。"]];

  function head() {
    return `<header><span class="tag">PRO MODEL · LAB</span><h1>職業版模型</h1>
      <p>照職業團隊的做法從頭建，跟原本的資金流向看板完全分開・更新 ${esc((DATA.generated_utc || "").replace("T", " ").replace("Z", " UTC"))}</p></header>`;
  }
  function stages() {
    return `<section class="card"><h2>進度</h2><p class="sub">每做完一個階段就停下來給你看，你確認後才做下一個。</p>
      <div class="steps">${STAGES.map(([s, t, d, wait], i) => `<div class="step ${s}"><div class="dot">${s === "done" ? "✓" : i}</div><div><b>${t}</b>${wait ? '<span class="pill">等你確認</span>' : ""}<p>${d}</p></div></div>`).join("")}</div>
      <p class="note">原則：核心模型不放賠率（先自己開盤，再跟莊家比）・只用比賽之前的資料・最後兩季留到最後才考一次・不用條款不允許抓取的網站。</p></section>`;
  }
  function clvIntro() {
    return `<section class="card"><h2>CLV 是什麼</h2><div class="gl">
      <div><b>搶到的價錢</b>你下注那一刻的賠率，跟「收盤」（開賽前最後的價錢）比是好還是壞。收盤是最多錢、最多消息進來之後的價錢，所以最準。</div>
      <div><b>CLV（期望值）</b>下注賠率 × 收盤的公平勝率 − 1。長期來說，獲利率會很接近這個數字。</div>
      <div><b>盤口移動</b>從你下注到收盤，市場覺得你押的那邊勝率變高還是變低（百分點）。正的＝你比市場早知道。</div>
      <div><b>為什麼比輸贏好用</b>輸贏要幾千注才看得出實力；CLV 幾百注就看得出來，因為它不管這場是不是剛好多進一球。</div></div></section>`;
  }
  function market() {
    const R = DATA.clv; if (!R) return "";
    const imp = (m) => (m.ll_first - m.ll_close) / m.ll_first * 100;
    const row = (k, m, src) => `<tr><td style="max-width:170px">${sp(k)}<div class="s">${src}</div></td><td class="r n">${m.n.toLocaleString("en-US")}</td><td class="r n ${gb(imp(m))}">${sgn(imp(m), 2)}%</td><td class="r n">${(m.move * 100).toFixed(1)}</td></tr>`;
    const H = R.market_hist || {}, Lv = R.market_live || {};
    return `<section class="card"><h2>收盤真的比較準嗎</h2><p class="sub">同一批比賽，用「早一點的盤」和「收盤」各自預測誰贏，比誰的誤差小。</p>
      <div class="scroll"><table><thead><tr><th>運動</th><th class="r">場數</th><th class="r">收盤準多少</th><th class="r">平均移動<br>（百分點）</th></tr></thead><tbody>
      <tr class="grp"><td colspan="4">歷史（幾萬場）</td></tr>${Object.entries(H).map(([k, m]) => row(k, m, m.what)).join("")}
      <tr class="grp"><td colspan="4">我們自己記的（Pinnacle 第一次看到 vs 收盤）</td></tr>${Object.entries(Lv).map(([k, m]) => row(k, m, `第一次看到約開賽前 ${Math.round(m.first_h)} 小時`)).join("")}</tbody></table></div>
      <p class="note">「收盤準多少」＝預測誤差（log loss）少了幾 %。歷史幾萬場，每個運動都是收盤比較準，所以拿收盤當標準答案是對的。我們自己記的才兩週、場數少，有的運動反過來是運氣。</p></section>`;
  }
  function signals() {
    const S = (DATA.clv || {}).signals || {}, s = S["ml_" + ST.thr];
    if (!s) return "";
    const a = s.all, diff = a.clv_us && a.clv_base && a.clv_us.n ? {n: a.clv_us.n, mean: a.clv_us.mean - a.clv_base.mean, se: a.clv_us.se} : null;
    const chips = ["10", "15", "20", "25", "30"].filter((t) => S["ml_" + t]).map((t) => `<button type="button" class="chip" data-thr="${t}" aria-pressed="${ST.thr === t}">${t}%</button>`).join("");
    const hr = (b) => `<tr><td>${b.label}</td><td class="r n">${(b.dp && b.dp.n) || 0}</td><td class="r n">${b.toward == null ? "–" : Math.round(b.toward * 100) + "%"} / ${b.away == null ? "–" : Math.round(b.away * 100) + "%"}</td><td class="r n ${gb(b.dp && b.dp.mean)}">${b.dp && b.dp.n ? ppt(b.dp.mean) : "–"}${luck(b.dp)}</td></tr>`;
    const lr = (mk, nm) => { const x = (S[`${mk}_${ST.thr}`] || {}).all; if (!x || !x.gain || !x.gain.n) return ""; return `<tr><td>${nm}</td><td class="r n">${x.gain.n}</td><td class="r n">${Math.round(x.toward * 100)}% / ${Math.round(x.away * 100)}%</td><td class="r n ${gb(x.gain.mean)}">${sgn(x.gain.mean, 2)}${luck(x.gain)}</td></tr>`; };
    const lines = lr("sp", "讓分") + lr("ou", "大小");
    return `<section class="card" id="sig"><h2>資金流向「錢比人多」：訊號一出現就下</h2><p class="sub">獨贏・錢% − 人% 第一次超過門檻的那一刻下注，跟 Pinnacle 收盤比。</p>
      <div class="chips">${chips}</div>
      <div class="kpis"><div class="kpi"><span>有收盤可對照</span><b>${a.dp.n}</b></div><div class="kpi"><span>平均盤口移動</span><b class="${gb(a.dp.mean)}">${ppt(a.dp.mean)}</b>${luck(a.dp)}</div><div class="kpi"><span>比同時間亂押好</span><b class="${gb(diff && diff.mean)}">${diff ? pp(diff.mean) : "–"}</b>${luck(diff)}</div></div>
      <div class="scroll"><table><tbody>
        <tr><td>之後盤口往訊號這邊移／往反方向移</td><td class="r n">${a.toward == null ? "–" : Math.round(a.toward * 100) + "%"} / ${a.away == null ? "–" : Math.round(a.away * 100) + "%"}</td></tr>
        <tr><td>CLV：用當時美國賠率下</td><td class="r n ${gb(a.clv_us.mean)}">${pp(a.clv_us.mean)}</td></tr>
        <tr><td>同一時間兩邊亂押（基準）</td><td class="r n ${gb(a.clv_base.mean)}">${pp(a.clv_base.mean)}</td></tr></tbody></table></div>
      <h3>離開賽多久出現的訊號</h3>
      <div class="scroll"><table><thead><tr><th>訊號出現時</th><th class="r">個數</th><th class="r">往這邊／反方向</th><th class="r">平均移動</th></tr></thead><tbody>${s.by_h.map(hr).join("")}</tbody></table></div>
      ${lines ? `<h3>讓分、大小：盤口線有沒有往這邊動（分）</h3><div class="scroll"><table><thead><tr><th>玩法</th><th class="r">個數</th><th class="r">往這邊／反方向</th><th class="r">平均（分）</th></tr></thead><tbody>${lines}</tbody></table></div>` : ""}
      <p class="note">平均移動接近 0、往這邊和反方向差不多＝訊號出現後市場沒有跟著走，目前還看不出錢比人多能提早知道結果。CLV 是負的主要是美國莊家的抽成（亂押也是負的），要看「比亂押好多少」。開賽前 5–10 分鐘才下，價錢就是收盤，CLV 一定約等於抽成。</p></section>`;
  }
  function model1() {
    const M = (DATA.clv || {}).model1_us || {}, ks = Object.keys(M).filter((k) => k !== "all");
    if (!ks.length) return "";
    const row = (k) => { const m = M[k], d = {n: m.n, mean: m.mean - m.base.mean, se: m.se}; return `<tr><td>${sp(k)}</td><td class="r n">${m.n}</td><td class="r n ${gb(m.mean)}">${pp(m.mean)}</td><td class="r n ${gb(m.base.mean)}">${pp(m.base.mean)}</td><td class="r n ${gb(d.mean)}">${pp(d.mean)}${luck(d)}</td><td class="r n ${gb(m.dp.mean)}">${ppt(m.dp.mean)}${luck(m.dp)}</td></tr>`; };
    return `<section class="card"><h2>原本的模型一，CLV 是多少</h2><p class="sub">拿新的成績單量一次舊模型：模型一・美國賠率的每一注，跟 Pinnacle 收盤比。</p>
      <div class="scroll"><table><thead><tr><th>運動</th><th class="r">注數</th><th class="r">CLV</th><th class="r">亂押</th><th class="r">比亂押好</th><th class="r">盤口移動</th></tr></thead><tbody>${ks.map(row).join("")}</tbody></table></div>
      <p class="note">全部 ${M.all.n} 注平均 CLV ${pp(M.all.mean)}，同時間亂押 ${pp(M.all.base)}。CLV 是負的＝長期大約每注虧這麼多，所以模型一實戰目前賺錢多半是運氣。比亂押好一點，是因為它會挑美國賠率給得比較大方的那一邊；盤口移動接近 0＝它沒有比市場早知道（它本來就是學市場）。這就是要做職業版的原因。</p></section>`;
  }
  function dataCheck() {
    const D = DATA.check; if (!D) return "";
    const pct = (a, n) => (n ? Math.round(a / n * 100) : 0);
    const cell = (a, n) => { const p = pct(a, n); return `<td class="r n ${p >= 97 ? "" : p >= 50 ? "warn" : "bad"}">${p}%</td>`; };
    const ss = D.soccer.seasons;
    const src = (s) => (s.psc && s.bfc ? "兩個都有" : s.psc ? "Pinnacle" : s.bfc ? "Betfair" : "沒有");
    const soc = ss.map((s) => `<tr><td class="n">${s.season}</td><td class="r n">${s.n.toLocaleString("en-US")}</td>${cell(s.res, s.n)}<td class="r n ${pct(s.bench, s.n) >= 97 ? "" : pct(s.bench, s.n) >= 50 ? "warn" : "bad"}">${pct(s.bench, s.n)}%<div class="s">${src(s)}${s.psc && s.psc < s.n * 0.97 ? `（P ${pct(s.psc, s.n)}%）` : ""}</div></td>${cell(s.shots, s.n)}</tr>`).join("");
    const tot = ss.reduce((a, s) => a + s.n, 0);
    const U = D.us || {};
    const us = Object.entries(U).map(([k, u]) => `<tr><td>${sp(k)}<div class="s">${esc(u.from)}–${esc(u.to)}，${u.seasons} 季</div></td><td class="r n">${u.n.toLocaleString("en-US")}</td>${cell(u.score, u.n)}${cell(u.close, u.n)}${cell(u.open, u.n)}</tr>`).join("");
    const C = (DATA.clv || {}).coverage || {};
    const cov = Object.entries(C).map(([k, c]) => `<tr><td>${sp(k)}</td><td class="r n">${c.games}</td><td class="r n">${c.pin}</td><td class="r n">${c.done}</td></tr>`).join("");
    const odd = (D.soccer.odd || []).map((o) => `${o.div} ${o.season}：${o.n} 場裡 ${o.res} 場有賽果`).join("；");
    return `<section class="card"><h2>資料檢查</h2><p class="sub">每一份要拿來訓練或當標準答案的資料，齊不齊全。黃色、紅色的格子是有缺的地方。</p>
      <h3>足球（第 1 階段用）：十個聯賽、${ss.length} 季、${tot.toLocaleString("en-US")} 場</h3>
      <div class="scroll"><table><thead><tr><th>球季</th><th class="r">場數</th><th class="r">賽果</th><th class="r">收盤<br>（標準答案）</th><th class="r">射門數</th></tr></thead><tbody>${soc}</tbody></table></div>
      <p class="note">比賽和賽果是完整的（法國聯賽 2019/20 疫情提前結束、2023/24 起改 18 隊，場數本來就比較少${odd ? "；" + esc(odd) : ""}）。<b>缺的是標準答案</b>：資料來源從 2025/26 季中起不再提供 Pinnacle 收盤，所以最後兩季改用 Betfair 交易所收盤（也是幾乎不抽水、很準的市場，2024/25 兩個都有，可以先確認兩者一致）。射門數 2014–2017 只有五大聯賽有。</p>
      <h3>美國四大歷史（第 2、3 階段用）</h3>
      <div class="scroll"><table><thead><tr><th>運動</th><th class="r">場數</th><th class="r">比分</th><th class="r">收盤</th><th class="r">開盤</th></tr></thead><tbody>${us}</tbody></table></div>
      <p class="note">比分和收盤賠率都完整；開盤賠率 NFL 沒有、NBA 只有近幾季。這兩個階段要用的比賽細節（每一個 play、每一球、射門）目前還沒有，到時候從公開來源重新下載、從頭建。</p>
      <h3>我們自己記的盤口（9/27 起）</h3>
      <div class="scroll"><table><thead><tr><th>運動</th><th class="r">場數</th><th class="r">對到 Pinnacle</th><th class="r">有賽果</th></tr></thead><tbody>${cov}</tbody></table></div>
      <p class="note">這部分不是缺，是本來就只能從開始記的那天往後累積。Pinnacle 大約 10/1 才開始記，所以早期有些比賽對不到。</p></section>`;
  }
  // ═════════ 第 1 階段：足球比分模型 ═════════
  const skill = (x, base) => (base - x) / base * 100;      // 比「只知道主和客平均比例」準幾 %
  function soccer() {
    const R = DATA.soccer; if (!R || !R.valid) return "";
    const V = R.valid, T = R.test, c = R.chosen;
    const col = (E, k) => (E && E.x12 && E.x12[k]) || null;
    // 準度表：同一批有 Pinnacle（驗證）／Betfair（考試）收盤的比賽
    const accRow = (nm, f, sub) => `<tr><td>${nm}${sub ? `<div class="s">${sub}</div>` : ""}</td>${[V, T].map((E) => { const v = E ? f(E) : null; return `<td class="r n ${v == null ? "" : v.cls || ""}">${v == null ? "–" : v.txt}</td>`; }).join("")}</tr>`;
    const vk = "psc", tk = "bfc";
    const K = (E) => (E === V ? vk : tk);
    const base = (E) => col(E, K(E)).base;
    const sk = (x, E) => ({txt: sgn(skill(x, base(E)), 2) + "%", cls: ""});
    const early = (E) => (col(E, "ps") && col(E, "ps").n > 1000 ? col(E, "ps") : col(E, "avg"));
    const catchUp = (E) => { const x = col(E, K(E)); return (x.base - x.model) / (x.base - x.market) * 100; };
    let h = `<section class="card"><span class="tag">STAGE 1 · SOCCER</span><h2>第 1 階段：足球比分模型</h2>
      <p class="sub">十個聯賽（五大聯賽＋次級聯賽）${(R.data || {}).matches ? R.data.matches.toLocaleString("en-US") + " 場" : ""}，完全不看賠率，只用比分和射正次數。</p>
      <div class="gl">
        <div><b>怎麼預測</b>每一隊有「攻擊力」和「防守力」兩個分數，再加上每個聯賽的主場優勢。用它們算出兩隊各自平均會進幾球，再換算成 0:0、1:0、2:1…每一種比分的機率，就能同時算出獨贏、讓球、大小的公平盤口。和局會比單純計算的多一點，模型也有修正。</div>
        <div><b>怎麼學</b>越近的比賽越重要（半衰期 ${c.half_life} 天＝${c.half_life} 天前的比賽只算一半）。進球有很多運氣，所以「表現」用 ${Math.round(c.w_goals * 100)}% 進球＋${Math.round((1 - c.w_goals) * 100)}% 射正次數換算。同一國的一、二級聯賽一起算，升降級的球隊分數會延續，另外學「剛升級、剛降級」平均差多少。</div>
        <div><b>怎麼考</b>每週只用之前的比賽重新學一次，預測接下來 7 天，一路往前推。2020/21–2024/25 用來挑設定（試了 ${(R.grid || []).length} 種）；最後兩季 2025/26–2026/27 挑好之後只考一次${T ? `（${esc((T.run_utc || "").replace("T", " "))} 考的）` : ""}。</div>
      </div></section>`;
    // 結論
    {
      const BB = (E, k) => (E && E.blend && E.blend[k]) || null;
      const vb = BB(V, "psc"), vc = (V.clv || {})["0.03"], tc = T && (T.clv || {})["0.03"];
      const pass1 = vb && vb.b > 0 && vb.gain > 2 * vb.se, pass2 = vc && vc.dp[0] > 2 * vc.dp[1] && vc.clv[0] > 0;
      h += `<section class="card" style="border-color:var(--accent)"><h2>第 1 階段結論：${pass1 && pass2 ? "過關" : "沒有過關"}</h2><div class="gl">
        <div><b>準度：追上收盤的 ${Math.round(catchUp(V))}%（考試季 ${T ? Math.round(catchUp(T)) : "–"}%）</b>只看比分和射正，就能做到市場的六、七成，機率也很誠實（說 30% 大約就開 30%）。這是正常的起點，但還是比收盤差。</div>
        <div><b>有沒有市場沒有的資訊：沒有</b>把模型混進收盤，模型的分量是負的（${vb ? vb.b.toFixed(2) : "–"}），代表模型跟收盤不一樣的地方，通常是模型錯。</div>
        <div><b>收盤有沒有往模型移：有，但非常小</b>模型看好的那邊，收盤平均只往那邊移 ${vc ? ppt(vc.dp[0]) : "–"} 個百分點（考試季 ${tc ? ppt(tc.dp[0]) : "–"}），遠遠不夠抵掉抽成：用早盤下注的 CLV 是 ${vc ? pp(vc.clv[0]) : "–"}，等於長期每 100 元虧 ${vc ? Math.abs(vc.clv[0] * 100).toFixed(0) : "–"} 元。</div>
        <div><b>代表什麼</b>只靠比分和射正這種「大家都看得到」的資料，打不贏市場，這跟職業圈的經驗一樣。要有優勢，需要市場還沒反映的東西（先發名單、傷兵、更細的比賽數據），或是更快的時間點。</div></div></section>`;
    }
    h += `<section class="card"><h2>準不準：跟市場比</h2><p class="sub">預測誰贏（主／和／客），誤差比「只知道主和客平均比例」少了幾 %。越大越準。</p>
      <div class="scroll"><table><thead><tr><th></th><th class="r">驗證季<br>2020–2025</th><th class="r">考試季<br>2025–2027</th></tr></thead><tbody>
        ${accRow("<b>我們的模型</b>", (E) => sk(col(E, K(E)).model, E), "不看任何賠率")}
        ${accRow("市場・早盤", (E) => { const x = early(E); return x ? sk(x.market, E) : null; }, "驗證季：Pinnacle 賽前 2–3 天；考試季：各家平均")}
        ${accRow("市場・收盤", (E) => sk(col(E, K(E)).market, E), "驗證季：Pinnacle；考試季：Betfair 交易所")}
        ${accRow("<b>模型追上收盤幾成</b>", (E) => ({txt: Math.round(catchUp(E)) + "%", cls: ""}))}
        ${accRow("場數", (E) => ({txt: col(E, K(E)).n.toLocaleString("en-US"), cls: ""}))}
      </tbody></table></div>
      <p class="note">一個只看比分的模型，能追上收盤的六、七成就算正常；全世界很少模型能單獨贏過 Pinnacle 收盤。重點是下面兩張表：它有沒有市場「還沒有」的資訊。</p></section>`;
    // 混合
    const B = (E, k) => (E && E.blend && E.blend[k]) || null;
    const bRow = (E, k, nm) => { const b = B(E, k); if (!b) return ""; const m = {n: b.n, mean: b.gain, se: b.se}; return `<tr><td>${nm}</td><td class="r n">${b.n.toLocaleString("en-US")}</td><td class="r n">${b.b.toFixed(2)}</td><td class="r n ${gb(b.gain)}">${sgn(b.gain / b.market * 100, 2)}%${luck(m)}</td></tr>`; };
    h += `<section class="card"><h2>模型＋收盤，會比收盤單獨更準嗎</h2><p class="sub">把模型和收盤混在一起預測（混合比例只用驗證季學，考試季直接套用）。誤差有變小，就代表模型有收盤沒算進去的東西。</p>
      <div class="scroll"><table><thead><tr><th></th><th class="r">場數</th><th class="r">模型分量</th><th class="r">誤差少了</th></tr></thead><tbody>
        ${bRow(V, "psc", "驗證季・Pinnacle 收盤")}${bRow(T, "psc", "考試季・Pinnacle 收盤")}${bRow(T, "bfc", "考試季・Betfair 收盤")}</tbody></table></div>
      <p class="note">「模型分量」是 0 就代表收盤已經包含模型知道的一切；正的代表模型多帶了一點東西；${[B(V, "psc"), B(T, "bfc")].some((b) => b && b.b < 0) ? "<b>負的</b>代表模型跟收盤不一樣的地方，通常是模型錯。誤差還是小了一點，是因為混合時把收盤的熱門機率稍微調高（收盤用簡單方法去抽水時，冷門會被算得偏高），這跟模型無關。" : "負的代表模型跟收盤不一樣的地方通常是模型錯。"}</p></section>`;
    // CLV
    const cRow = (E, th) => { const x = E && E.clv && E.clv[th]; if (!x) return ""; const dp = {n: x.n, mean: x.dp[0], se: x.dp[1]}, roi = {n: x.n, mean: x.roi[0], se: x.roi[1]}, cl = {n: x.n, mean: x.clv[0], se: x.clv[1]};
      return `<tr><td>≥ ${Math.round(+th * 100)}%<div class="s">${x.n.toLocaleString("en-US")} 注</div></td><td class="r n">${Math.round(x.toward * 100)}% / ${Math.round(x.away * 100)}%</td><td class="r n ${gb(dp.mean)}">${ppt(dp.mean)}${luck(dp)}</td><td class="r n ${gb(cl.mean)}">${pp(cl.mean)}${luck(cl)}</td><td class="r n ${gb(roi.mean)}">${pp(roi.mean)}${luck(roi)}</td></tr>`; };
    const cTable = (E, nm) => (E && E.clv ? `<h3>${nm}</h3><div class="scroll"><table><thead><tr><th>模型看好<br>多少才下</th><th class="r">往模型／<br>反方向</th><th class="r">平均<br>移動</th><th class="r">CLV</th><th class="r">實際<br>投報率</th></tr></thead><tbody>${["0", "0.03", "0.05", "0.1"].map((t) => cRow(E, t)).join("")}</tbody></table></div>
      ${E.clv.slope ? `<p class="note">整體來看：模型比早盤多看好 10 個百分點的時候，收盤平均往模型那邊移 ${(E.clv.slope.slope * 10).toFixed(2)} 個百分點（±${(E.clv.slope.se * 20).toFixed(2)}）。</p>` : ""}` : "");
    h += `<section class="card"><h2>職業的檢驗：收盤有沒有往模型那邊移</h2><p class="sub">用早盤賠率下注：模型勝率 × 早盤賠率 − 1 超過門檻就下。之後收盤往模型那邊移，代表模型比市場早知道。</p>

      <p class="note">CLV 是用早盤賠率配上收盤的公平勝率算的，最能代表長期真正的獲利率；「實際投報率」是真的照比分結算，運氣成分大很多。台彩抽 15%，這裡的數字都是在國際盤（抽 2–5%）下注的情況。</p></section>`;
    // 校準
    const cal = (E) => (E && E.calib ? E.calib : []);

    if (cv.length) {
      const map = Object.fromEntries(ct.map((x) => [x.bin, x]));
      h += `<section class="card"><h2>機率誠不誠實</h2><p class="sub">模型說「這邊有 x%」的所有選項，實際開出幾 %。兩欄越接近越好。</p>
        <div class="scroll"><table><thead><tr><th>模型說</th><th class="r">驗證季<br>平均說</th><th class="r">實際開出</th><th class="r">考試季<br>平均說</th><th class="r">實際開出</th></tr></thead><tbody>
        ${cv.map((x) => { const t = map[x.bin]; return `<tr><td class="n">${x.bin}</td><td class="r n">${x.pred}%</td><td class="r n">${x.real}%</td><td class="r n">${t ? t.pred + "%" : "–"}</td><td class="r n">${t ? t.real + "%" : "–"}</td></tr>`; }).join("")}</tbody></table></div></section>`;
    }
    // 大小、讓分
    const mk = (E, grp, k) => (E && E[grp] && E[grp][k]) || null;
    const oRow = (nm, E, grp, k) => { const x = mk(E, grp, k); if (!x) return ""; const d = (x.model - x.market) / x.market * 100; return `<tr><td>${nm}</td><td class="r n">${x.n.toLocaleString("en-US")}</td><td class="r n ${d <= 0 ? "good" : "bad"}">${d <= 0 ? "準 " + Math.abs(d).toFixed(2) : "差 " + d.toFixed(2)}%</td></tr>`; };
    h += `<section class="card"><h2>大小 2.5、亞洲讓分</h2><p class="sub">同一個比分模型算出來的，跟收盤比（讓分只比半球盤，例如 −0.5、+1.5，不會走盤）。</p>
      <div class="scroll"><table><thead><tr><th></th><th class="r">場數</th><th class="r">模型比收盤</th></tr></thead><tbody>
      <tr class="grp"><td colspan="3">驗證季</td></tr>${oRow("大小 2.5・Pinnacle", V, "ou", "ou_pc")}${oRow("讓分・Pinnacle", V, "ah", "ah_pc")}
      <tr class="grp"><td colspan="3">考試季</td></tr>${oRow("大小 2.5・Betfair", T, "ou", "ou_bfc")}${oRow("大小 2.5・各家平均", T, "ou", "ou_avgc")}${oRow("讓分・Betfair", T, "ah", "ah_bfc")}</tbody></table></div></section>`;
    // 設定比較
    const G = (R.grid || []).slice().sort((a, b) => a.ll_model - b.ll_model);
    if (G.length) h += `<section class="card"><details><summary><b>試過的 ${G.length} 種設定</b>（只在驗證季比較）</summary>
      <div class="scroll" style="margin-top:8px"><table><thead><tr><th class="r">半衰期</th><th class="r">進球比重</th><th class="r">拉回</th><th class="r">比亂猜準</th></tr></thead><tbody>${G.map((g) => `<tr${g.half_life === c.half_life && g.w_goals === c.w_goals && g.ridge === c.ridge ? ' style="background:var(--accent-soft)"' : ""}><td class="r n">${g.half_life} 天</td><td class="r n">${Math.round(g.w_goals * 100)}%</td><td class="r n">${g.ridge}</td><td class="r n">${sgn(skill(g.ll_model, g.ll_base), 2)}%</td></tr>`).join("")}</tbody></table></div></details></section>`;
    return h;
  }
  // ═════════ 第 2 階段：美國運動 ═════════
  function usStage() {
    const U = DATA.us; if (!U || !S2) return "";
    const M = U.mlb, N = U.nfl, H = U.nhl;

    const bl = (m) => { if (!m) return "–"; const b = m.blend; const x = {n: m.n, mean: b.gain, se: b.se}; return `${b.b.toFixed(2)}${luck(x)}`; };
    const mv = (m, k) => { const c = m && m.clv && m.clv[k]; if (!c) return "沒有開盤資料"; const d = {n: c.n, mean: c.dp[0], se: c.dp[1]}; return `<span class="${gb(c.dp[0])}">${ppt(c.dp[0])}</span>（${Math.round(c.toward * 100)}% / ${Math.round(c.away * 100)}%）${luck(d)}`; };

      <div><b>NHL：沒有</b>追上收盤約六成，混合後沒有比較準。另外發現舊的冰球盤口資料有問題（見下面）。</div>
      ${U.nba && U.nba.test ? (() => { const n = U.nba.test.ml.clv["calm_0.03"]; return `<div><b>NBA（第 3 階段）：有一點，但更弱</b>收盤往模型移 ${Math.round(n.toward * 100)}% vs 反方向 ${Math.round(n.away * 100)}%（平均 ${ppt(n.dp[0])} 個百分點），比 MLB 弱很多；用開盤價下注 CLV ${pp(n.clv[0])}，扣掉抽成是虧的。缺陣球員的影響，用正負值估得不夠好（職業團隊用更細的球員數據），這是 NBA 最可能改進的地方。</div>`; })() : ""}
      <div><b>代表什麼</b>MLB 的開盤比較「軟」，先發投手的數據能預測盤口會往哪裡走——這正是職業玩家在 MLB 常用的做法：開盤就下、搶價錢。但要真的賺，需要比美國平均更好的價錢（例如 Pinnacle），而台彩抽 15%，差太多。</div></div></section>`;
    // MLB 詳細
    const cRow = (c, th, lab) => { const x = c && c[th]; if (!x) return ""; const dp = {n: x.n, mean: x.dp[0], se: x.dp[1]}, cl = {n: x.n, mean: x.clv[0], se: x.clv[1]}, roi = x.roi ? {n: x.n, mean: x.roi[0], se: x.roi[1]} : null;
      return `<tr><td>${lab}<div class="s">${x.n.toLocaleString("en-US")} 注</div></td><td class="r n">${Math.round(x.toward * 100)}% / ${Math.round(x.away * 100)}%</td><td class="r n ${gb(dp.mean)}">${ppt(dp.mean)}${luck(dp)}</td><td class="r n ${gb(cl.mean)}">${pp(cl.mean)}${luck(cl)}</td><td class="r n ${roi ? gb(roi.mean) : ""}">${roi ? pp(roi.mean) + luck(roi) : "–"}</td></tr>`; };
    const mlbT = (c, nm) => `<h3>${nm}</h3><div class="scroll"><table><thead><tr><th>模型看好<br>多少才下</th><th class="r">往模型／<br>反方向</th><th class="r">平均<br>移動</th><th class="r">CLV</th><th class="r">實際<br>投報率</th></tr></thead><tbody>
      ${["0.03", "0.05", "0.1"].map((t) => cRow(c, "calm_" + t, "≥ " + Math.round(t * 100) + "%")).join("")}</tbody></table></div>
      ${c.slope ? `<p class="note">整體：模型比開盤多看好 10 個百分點，收盤平均往模型移 ${(c.slope.slope * 10).toFixed(1)} 個百分點（±${(c.slope.se * 20).toFixed(1)}）。</p>` : ""}`;
    h += `<section class="card"><h2>MLB：開盤下注，收盤有沒有往模型移</h2><p class="sub">用開盤的美國平均賠率下注（模型勝率 × 開盤賠率 − 1 超過門檻才下），跟美國收盤比。已排除開盤到收盤大動的比賽。</p>
      ${mlbT(M.valid.ml.clv, "驗證季 2016–2023")}${mlbT(M.test.ml.clv, "考試季 2024–2025")}
      <p class="note">驗證季：模型準度 ${M.valid.ml.ll_model} vs 開盤 ${M.valid.ml.ll_open ?? "–"} vs 收盤 ${M.valid.ml.ll_close}（數字越小越準）。大小分：模型對總分的預測沒有比收盤大小線好（命中率約 50%）。</p></section>`;
    // NFL
    const lt = (L, nm) => { if (!L) return ""; const rows = ["0.0", "0.03", "0.08"].filter((t) => L[t]).map((t) => { const x = L[t], m = {n: x[2], mean: x[0] - 0.5238, se: x[1]}; return `<tr><td>${nm}・模型有 ${Math.round(+t * 100 + 50)}% 以上把握</td><td class="r n">${x[2]}</td><td class="r n ${x[0] > 0.5238 ? "good" : "bad"}">${(x[0] * 100).toFixed(1)}%${luck(m)}</td></tr>`; }).join(""); return rows; };
    h += `<section class="card"><h2>NFL：照模型下讓分、大小</h2><p class="sub">美國盤讓分、大小要贏 52.4% 才打平（−110 的賠率）。</p>
      <div class="scroll"><table><thead><tr><th></th><th class="r">注數</th><th class="r">命中率</th></tr></thead><tbody>
      <tr class="grp"><td colspan="3">驗證季 2017–2023</td></tr>${lt(N.valid.spread, "讓分")}${lt(N.valid.total, "大小")}
      <tr class="grp"><td colspan="3">考試季 2024–2025</td></tr>${lt(N.test.spread, "讓分")}${lt(N.test.total, "大小")}</tbody></table></div>
      <p class="note">分差預測的平均誤差：模型 ${N.test.mae.model} 分、收盤讓分 ${N.test.mae.market} 分（考試季）。</p></section>`;
    // NBA
    if (U.nba && U.nba.test) {
      const B = U.nba;
      h += `<section class="card"><h2>NBA：開盤下注，收盤有沒有往模型移</h2><p class="sub">只有 2023–24 起有開盤（驗證季只有 1 季）。已排除開盤到收盤大動（常是臨時傷兵）的比賽。</p>
        ${mlbT(B.valid.ml.clv, "驗證季（只有 2023–24 有開盤）")}${mlbT(B.test.ml.clv, "考試季 2024–25、2025–26")}
        <p class="note">分差預測平均誤差：模型 ${B.test.mae.model} 分、收盤讓分 ${B.test.mae.market} 分。照模型下讓分、大小，命中率都在 50% 左右（要 52.4% 才打平）。</p></section>`;
    }
    // NHL
    h += `<section class="card"><h2>NHL：資料問題</h2><p class="note" style="margin:0">${esc(H.odds_note || "")} 這也代表：原本看板「模型一」的冰球部分，訓練時用過這些有問題的盤口，之後值得回頭檢查（要動原本的模型，會先問你）。</p></section>`;
    h += `<section class="card"><p class="note" style="margin:0">資料來源：MLB 逐打席紀錄來自 Retrosheet——The information used here was obtained free of charge from and is copyrighted by Retrosheet. Interested parties may contact Retrosheet at www.retrosheet.org。NHL 射門品質來自 MoneyPuck.com。NFL 每一個 play 來自 nflverse。NBA 球隊、球員數據來自 hoopR / sportsdataverse（CC BY 4.0）。</p></section>`;
    return h;
  }
  function render() {
    if (!DATA) { $("app").innerHTML = `<div class="card">沒有資料。</div>`; return; }
    $("app").innerHTML = head() + stages() + usStage() + soccer() + dataCheck() + clvIntro() + market() + signals() + model1() +
      `<footer>職業版只做研究和驗證，跟原本的看板、模型一完全分開。</footer>`;
  }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-thr]"); if (!t) return;
    ST.thr = t.dataset.thr; store.set("thr", ST.thr);
    const y = window.scrollY; render(); window.scrollTo(0, y);
  });
  render();
})();
</script>
