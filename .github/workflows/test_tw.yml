name: Test Taiwan lottery access

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test connection
        run: |
          for u in https://www.sportslottery.com.tw/zh-tw/game/pre https://blob.sportslottery.com.tw/apidata/Live/On.json; do
            echo "== $u"
            curl -s -o /tmp/out -w "HTTP %{http_code} size %{size_download}\n" -A "Mozilla/5.0" --max-time 20 "$u" || echo "連線失敗"
            head -c 300 /tmp/out; echo
          done
