name: Pro data probe

# 職業版：試探資料來源（只印結果，不存資料）
on:
  workflow_dispatch: {}
  push:
    paths:
      - pro/espn_soccer_probe.py

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - run: python -m pro.espn_soccer_probe
      - run: python -m pro.injury_watch nba && head -5 docs/data/nba/injury_log_*.csv
