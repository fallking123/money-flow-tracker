name: Pro data probe

# 職業版：試探資料來源（只印結果，不存資料）
on:
  workflow_dispatch: {}
  push:
    paths:
      - pro/espn_soccer_probe.py
      - .github/workflows/pro_probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - run: python -m pro.espn_soccer_probe > docs/data/pro/probe_espn_soccer.txt 2>&1 || true
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pro/probe_espn_soccer.txt
          git commit -m "職業版：足球資料來源試探結果" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
