name: Diag ESPN
on:
  push:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests==2.32.3
      - run: |
          mkdir -p docs/probe
          python - > docs/probe/diag.txt 2>&1 <<'PY'
          import requests
          B = "https://site.api.espn.com/apis/site/v2/sports/"
          tests = [
            ("football/nfl", {"dates": "20260927-20261004"}),
            ("football/nfl", {"dates": "20261004"}),
            ("football/nfl", {"dates": "20261004", "limit": "1000"}),
            ("football/college-football", {"dates": "20261003", "groups": "80"}),
            ("football/college-football", {"dates": "20261003", "groups": "80", "limit": "300"}),
            ("football/college-football", {"dates": "20261003", "groups": "80", "limit": "1000"}),
            ("baseball/mlb", {"dates": "20260927"}),
            ("baseball/mlb", {"dates": "20260926-20260928"}),
            ("hockey/nhl", {"dates": "20260929"}),
            ("basketball/mens-college-basketball", {"dates": "20261115", "groups": "50", "limit": "500"}),
          ]
          for path, params in tests:
              r = requests.get(B + path + "/scoreboard", params=params, timeout=30)
              n = len(r.json().get("events", [])) if r.ok else r.text[:100]
              print(path, params, r.status_code, n)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/probe && git commit -m "diag" && for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
