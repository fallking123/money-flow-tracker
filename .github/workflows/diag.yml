name: Diag ESPN
on:
  push:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests==2.32.3
      - run: |
          mkdir -p docs/probe
          { python backfill_results.py; python scrape_context.py; python scrape_odds.py; } > docs/probe/diag.txt 2>&1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs && git commit -m "驗證：回填比分、背景資料" && for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
