name: Diag ESPN
on:
  push:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests==2.32.3
      - run: |
          mkdir -p docs/probe
          python - > docs/probe/match.txt 2>&1 <<'PY'
          from datetime import datetime, timezone, timedelta
          from sports_common import SPORTS, espn_events, match_event, is_college, sbd_full_name
          from scrape_odds import fetch_direct
          now = datetime.now(timezone.utc)
          for s, cfg in SPORTS.items():
              games = [g for g in fetch_direct(s) if g.get("status") == "not_started"]
              if not games:
                  print(s, "no games"); continue
              last = max(datetime.fromisoformat(g["scheduled"].replace("Z", "+00:00")) for g in games)
              evs = espn_events(s, now - timedelta(days=1), min(last, now + timedelta(days=9)))
              bad = []
              for g in games:
                  if match_event(g, evs, college=is_college(s)) is None:
                      c = g["competitors"]
                      bad.append((c["away"], c["home"], g["scheduled"]))
              print(s, "games", len(games), "espn", len(evs), "unmatched", len(bad))
              for b in bad[:40]:
                  print("   ", b)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/probe && git commit -m "diag match" && for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
