name: Download history (model 1 training data)

# 模型一用的歷史比賽＋賠率。改 download_history.py 推上來就會跑；之後每週一補最新一季
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 20 * * 0"
  push:
    paths:
      - download_history.py
      - .github/workflows/history.yml

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3
      - name: Download
        run: python download_history.py nba,nhl
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "歷史比賽資料更新"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
