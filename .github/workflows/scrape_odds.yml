name: Scrape odds (money flow)

on:
  workflow_dispatch: {}
  # 手動馬上更新：改 force_update.txt 推上去就會跑一次（檔案內容＝要強制重抓的運動）
  push:
    paths:
      - force_update.txt
  schedule:
    - cron: "*/15 22-23,0-3 * * *"
    - cron: "*/30 16-19 * * *"
    - cron: "0 4,10,14,20 * * *"

permissions:
  contents: write

concurrency:
  group: scrape-odds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests==2.32.3
      - name: Run odds scraper (all sports)
        run: |
          set +e
          if [ "${{ github.event_name }}" = "push" ]; then export FORCE_SPORTS="$(head -1 force_update.txt)"; echo "強制更新：$FORCE_SPORTS"; fi
          python scrape_odds.py
          code=$?
          set -e
          if [ $code -eq 3 ]; then
            echo "直接讀取被擋，改用瀏覽器模式"
            pip install playwright==1.47.0
            playwright install --with-deps chromium
            python scrape_odds.py --browser
          elif [ $code -ne 0 ]; then
            exit $code
          fi
      - name: Other markets (team totals, first 5 innings, periods)
        run: python scrape_extra.py || echo "其他玩法抓取失敗，不影響主資料"
      - name: Pinnacle lines (sharp / Asian money direction)
        run: python scrape_pinnacle.py mlb,nba,nfl,nhl || echo "Pinnacle 抓取失敗，不影響主資料"
      - name: Track model picks (every game, settle with 台彩 odds)
        run: python track_models.py mlb,nba,nfl,nhl || echo "模型實戰記錄失敗，不影響主資料"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "資金流向快照更新"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
