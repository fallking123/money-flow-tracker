name: Scrape soccer (money flow + European odds)

# 足球：每小時跑一次；程式自己依距離開賽時間決定要不要記（越接近開賽越密）
on:
  workflow_dispatch: {}
  schedule:
    - cron: "25 * * * *"
  push:
    paths:
      - scrape_soccer.py
      - .github/workflows/scrape_soccer.yml

permissions:
  contents: write

concurrency:
  group: scrape-soccer
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests==2.32.3
      - name: Skip if the resident worker is running
        id: alive
        if: github.event_name == 'schedule'
        run: |
          if python resident.py --alive; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "常駐工作在跑，這次跳過"; fi
      - name: Run soccer scraper
        if: steps.alive.outputs.skip != 'true'
        run: python scrape_soccer.py
      - name: Pinnacle lines (Europe / Asia sharp money)
        if: steps.alive.outputs.skip != 'true'
        run: python scrape_pinnacle.py soccer || echo "Pinnacle 抓取失敗，不影響主資料"
      - name: Track model picks (every game, settle with 台彩 odds)
        if: steps.alive.outputs.skip != 'true'
        run: python track_models.py soccer || echo "模型實戰記錄失敗，不影響主資料"
      - name: Value bet alerts (台彩 or US odds EV >= +2%)
        if: steps.alive.outputs.skip != 'true'
        run: python alerts.py soccer || echo "划算注提醒失敗，不影響主資料"
      - name: Commit and push
        if: steps.alive.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "足球資料更新"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 15
          done
          exit 1
