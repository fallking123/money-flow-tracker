name: Probe LoL data
on:
  workflow_dispatch: {}
  push:
    paths: [probe_lol.py, .github/workflows/probe_lol.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests==2.32.3
      - run: mkdir -p docs/data/esports && python probe_lol.py > docs/data/esports/probe_lol.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/esports/probe_lol.txt
          git commit -m "電競：英雄聯盟資料來源試探" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
