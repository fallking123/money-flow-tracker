name: Probe sports data sources

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/probe_sports.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        run: |
          pip install requests==2.32.3
          mkdir -p docs/probe
          cat > probe.py <<'PY'
          import json, requests
          H = {"User-Agent": "Mozilla/5.0"}
          out = {}
          r = requests.get("https://www.sportsbettingdime.com/wp-json/adpt/v1", timeout=30, headers=H)
          out["index_status"] = r.status_code
          try:
              out["routes"] = sorted(r.json().get("routes", {}).keys())
          except Exception as e:
              out["routes_err"] = str(e); out["text"] = r.text[:500]
          tries = {}
          for name in ["cfb", "ncaafb", "college-football", "ncaa-football", "ncaa", "cbb", "ncaamb", "college-basketball", "ncaa-basketball", "wnba", "soccer", "epl", "mls", "ufc", "mma"]:
              try:
                  rr = requests.get(f"https://www.sportsbettingdime.com/wp-json/adpt/v1/{name}-odds?format=us", timeout=30, headers=H)
                  n = len(rr.json().get("data", [])) if rr.ok else None
                  tries[name] = [rr.status_code, n]
              except Exception as e:
                  tries[name] = str(e)
          out["tries"] = tries
          json.dump(out, open("docs/probe/probe3.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(out, indent=1)[:3000])
          PY
          python probe.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/probe
          git commit -m "探測各運動資料來源" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
