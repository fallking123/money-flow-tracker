name: Probe sports data sources

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/probe_sports.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install playwright==1.47.0 requests==2.32.3
          playwright install --with-deps chromium
      - name: Probe
        run: |
          mkdir -p docs/probe
          cat > probe.py <<'PY'
          import json, requests
          from playwright.sync_api import sync_playwright
          SPORTS = ["mlb", "nfl", "ncaaf", "nba", "nhl", "ncaab", "wnba"]
          out = {}
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True)
              for s in SPORTS:
                  info = {"urls": [], "samples": {}, "error": None}
                  pg = b.new_page()
                  def rec(r, info=info):
                      if "/wp-json/" in r.url:
                          info["urls"].append(f"{r.status} {r.url}")
                          if "odds" in r.url and r.url not in info["samples"]:
                              try:
                                  body = r.json()
                                  data = body.get("data", []) if isinstance(body, dict) else body
                                  info["samples"][r.url] = {"keys": list(body.keys()) if isinstance(body, dict) else None,
                                                            "count": len(data), "first": data[:2]}
                              except Exception as e:
                                  info["samples"][r.url] = {"err": str(e)}
                  pg.on("response", rec)
                  try:
                      resp = pg.goto(f"https://www.sportsbettingdime.com/{s}/public-betting-trends/", wait_until="networkidle", timeout=90000)
                      info["status"] = resp.status if resp else None
                      pg.wait_for_timeout(3000)
                  except Exception as e:
                      info["error"] = str(e)
                  pg.close()
                  out[s] = info
              b.close()
          espn = {}
          for s, path in {"nfl": "football/nfl", "ncaaf": "football/college-football", "nba": "basketball/nba",
                          "nhl": "hockey/nhl", "ncaab": "basketball/mens-college-basketball", "wnba": "basketball/wnba",
                          "mlb": "baseball/mlb"}.items():
              try:
                  r = requests.get(f"https://site.api.espn.com/apis/site/v2/sports/{path}/scoreboard", timeout=20)
                  j = r.json()
                  ev = j.get("events", [])
                  espn[s] = {"status": r.status_code, "events": len(ev), "first": ev[:1]}
              except Exception as e:
                  espn[s] = {"error": str(e)}
          json.dump({"sbd": out, "espn": espn}, open("docs/probe/probe.json", "w"), ensure_ascii=False, indent=1, default=str)
          for s, i in out.items():
              print(s, i.get("status"), i.get("error"), len(i["urls"]), {u[:90]: v.get("count") for u, v in i["samples"].items()})
          PY
          python probe.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/probe
          git commit -m "探測各運動資料來源" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
