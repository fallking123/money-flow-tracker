<title>資金流向看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@600;700;800&display=swap">
<style>
/* 清爽卡片風格：淺色為主，跟著系統切換深色 */
:root{
  --bg:#F2F5F9; --card:#FFFFFF; --soft:#F4F7FB; --soft2:#EAEFF5; --ink:#1D2433; --ink2:#46526A; --muted:#6B7A90; --line:#E3E8EF;
  --accent:#2F6FEB; --accent-soft:#E7EFFE;
  --good:#137A43; --good-soft:#E6F5EC; --bad:#C2410C; --bad-soft:#FDEEE6; --warn:#9A5B00; --warn-soft:#FFF1D6;
  --band:#8A97AB; --shadow:0 6px 20px rgba(40,60,90,.07);
  --num:"Nunito","Noto Sans TC",system-ui,sans-serif;
  --tc:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --tabh:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E131A; --card:#171E28; --soft:#1D2531; --soft2:#243040; --ink:#E8EDF4; --ink2:#BBC5D3; --muted:#8B98AD; --line:#2A3442;
    --accent:#6EA2FF; --accent-soft:#1B2A45;
    --good:#4CCB85; --good-soft:#16301F; --bad:#F2905F; --bad-soft:#3A2217; --warn:#F2B24C; --warn-soft:#3A2C12;
    --band:#7C8AA0; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E131A; --card:#171E28; --soft:#1D2531; --soft2:#243040; --ink:#E8EDF4; --ink2:#BBC5D3; --muted:#8B98AD; --line:#2A3442;
  --accent:#6EA2FF; --accent-soft:#1B2A45;
  --good:#4CCB85; --good-soft:#16301F; --bad:#F2905F; --bad-soft:#3A2217; --warn:#F2B24C; --warn-soft:#3A2C12;
  --band:#7C8AA0; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--tc);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
.n{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums}
.mut{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 頂部 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;flex:none}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.upd{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.upd b{color:var(--ink2);font-weight:700}
.navtop{display:flex;gap:4px;background:var(--soft2);padding:4px;border-radius:999px}
.navtop button{appearance:none;border:0;background:none;padding:6px 15px;border-radius:999px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap}
.navtop button[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tabs{display:none}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
@media (max-width:899px){
  .navtop{display:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{appearance:none;border:0;background:none;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
  .tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
  main{padding-bottom:calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px))}
}

/* ── 共用 ── */
h1{font-size:24px;font-weight:900;margin:0;text-wrap:balance}
.intro{color:var(--muted);font-size:14px;margin:4px 0 16px;max-width:62ch}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
.card h3{margin:0 0 10px;font-size:16px;font-weight:700}
.card h3 small{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:6px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.chip .c{font-family:var(--num);font-weight:700;color:var(--muted);margin-left:5px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.7}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--soft2);border-radius:12px;padding:3px}
.seg button{appearance:none;border:0;background:none;padding:6px 16px;border-radius:9px;cursor:pointer;color:var(--ink2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.thr{display:flex;align-items:center;gap:10px;flex:1;min-width:240px;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.thr label{font-size:12.5px;color:var(--muted);line-height:1.3}
.thr input{flex:1;min-width:0;accent-color:var(--accent)}
.thr output{font-family:var(--num);font-weight:800;font-size:17px;min-width:3.4ch;text-align:right;color:var(--accent)}
.tog{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--ink2)}
.tog[aria-pressed="true"]{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:700}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.day{font-weight:700;font-size:15px;margin:18px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.day:first-child{margin-top:0}
.day span{font-weight:400;font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.pill.post{background:var(--warn-soft);color:var(--warn)}
.pill.lg{background:var(--soft2);color:var(--ink2)}
.pill.sig{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.ts-wrap{grid-column:1/-1}
.ts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.team-st{background:var(--soft);border-radius:12px;padding:8px 10px}
.team-st .mrow{border-bottom-color:var(--soft2)}
.ts-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ts-h .dot{width:28px;height:28px;font-size:10px}
.sf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.sf>div{background:var(--soft);border-radius:14px;padding:12px}
.sf h5{margin:0 0 2px;font-size:15px}
.sf p{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.sf .lab{font-size:12px;color:var(--muted);margin:6px 0 4px}
.feat li.plan{background:none;border:1px dashed var(--line);color:var(--muted)}
.sf .feat li{background:var(--card)}

/* ── 比賽卡 ── */
.game{display:flex;flex-direction:column;gap:12px}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.g-top .l{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g-top .t{color:var(--ink);font-weight:800;font-family:var(--num);font-size:15px}
.teams{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tm{display:flex;align-items:center;gap:10px;min-width:0}
.tm.r{flex-direction:row-reverse;text-align:right}
.dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:12px;flex:none;box-shadow:inset 0 -4px 0 var(--c2,transparent)}
.tm .nm{font-weight:700;font-size:16.5px;line-height:1.25}
.tm .od{font-family:var(--num);font-weight:700;color:var(--muted);font-size:13px}
.vs{color:var(--muted);font-size:12px;font-family:var(--num)}
.vs.draw{background:var(--soft);border-radius:999px;padding:3px 10px;font-weight:800;color:var(--ink2);white-space:nowrap}
.tb.mini{font-size:12.5px;margin-bottom:6px} .tb.mini td,.tb.mini th{padding:4px 6px}
.say{border-radius:14px;padding:11px 13px;font-size:14.5px;line-height:1.6;background:var(--soft)}
.say.on{background:var(--good-soft)}
.say.on b.who{color:var(--good)}
.say .sub{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.say .x{display:block;font-size:13px;margin-top:4px}
.mdl{border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.mdl b{color:var(--accent);margin-right:8px}
.mdl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.mbar{display:grid;grid-template-columns:9.5em 1fr 4.2em;gap:8px;align-items:center;font-size:13.5px;margin:5px 0}
.mbar .tr{height:10px;border-radius:999px;background:var(--soft2);overflow:hidden}
.mbar .tr i{display:block;height:100%;border-radius:999px}
.tug .t{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);margin:8px 0 4px}
.tug .t:first-child{margin-top:0}
.tug .t b{font-family:var(--num);font-weight:800;color:var(--ink);font-size:14.5px}
.tug .mid{font-size:12px}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--soft2);gap:2px}
.bar i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--soft);border-radius:12px;padding:9px 11px;font-size:12px;color:var(--muted);line-height:1.35}
.tile b{display:block;font-family:var(--num);font-weight:800;font-size:19px;color:var(--ink);margin-top:3px}
.tile.bad b{color:var(--bad)} .tile.good b{color:var(--good)}
.twnote{font-size:12.5px;color:var(--muted);margin-top:-4px}
.more{appearance:none;border:0;background:none;color:var(--accent);font-size:13.5px;font-weight:700;cursor:pointer;padding:2px 0;align-self:flex-start}
.det{border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.det h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:500}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow>span:first-child{color:var(--muted);flex:none}
.mrow>span:last-child{text-align:right}
.pc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--soft);margin-bottom:6px;animation:rise .45s ease both}
.pc:nth-child(3){animation-delay:.07s}
.pc .nm{font-weight:700;font-size:14px}
.pc .st{font-size:12px;color:var(--muted)}
.pc .dot{width:32px;height:32px;font-size:10.5px}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.spark svg{display:block;width:100%;height:auto}

/* ── 成績頁 ── */
.hero{display:flex;flex-direction:column;gap:12px}
.hero .big{font-size:18px;font-weight:700;line-height:1.55}
.hero .big .n{font-size:20px}
.verdict{border-radius:14px;padding:11px 13px;background:var(--soft);font-size:14px}
.verdict b{display:block;font-size:15px;margin-bottom:2px}
.verdict.good{background:var(--good-soft)} .verdict.good b{color:var(--good)}
.verdict.bad{background:var(--bad-soft)} .verdict.bad b{color:var(--bad)}
.verdict small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kp .tile{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px}
.kp .tile b{font-size:22px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .track{flex:1;height:8px;border-radius:999px;background:var(--soft2);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:3px}
.chart svg{display:block;width:100%;height:auto}
.hc{display:flex;flex-direction:column;gap:8px}
.hc .it{border-radius:12px;padding:9px 12px;background:var(--good-soft);font-size:14px}
.hc .it.w{background:var(--bad-soft)}
.hc .it small{display:block;color:var(--ink2);font-size:12.5px}
details.more-sec{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
details.more-sec>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more-sec>summary::-webkit-details-marker{display:none}
details.more-sec>summary::after{content:"＋";color:var(--muted);font-weight:400}
details.more-sec[open]>summary::after{content:"－"}
details.more-sec>div{padding:0 16px 16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.tb{font-size:13.5px}
.tb th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb tr:last-child td{border-bottom:0}
.tb .r{text-align:right}
.tb td.n{font-weight:700}
.tb th button{appearance:none;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}
.tb th button[data-dir="1"]::after{content:" ▲";font-size:9px}
.tb th button[data-dir="-1"]::after{content:" ▼";font-size:9px}
.few{font-size:11px;color:var(--muted);background:var(--soft2);border-radius:6px;padding:0 5px;margin-left:5px}
.res{font-weight:700;font-size:12px;padding:1px 8px;border-radius:999px}
.res.w{background:var(--good-soft);color:var(--good)} .res.l{background:var(--bad-soft);color:var(--bad)} .res.p{background:var(--soft2);color:var(--muted)}
.mx td,.mx th{text-align:center!important;padding:5px!important}
.mx .cell{display:inline-block;min-width:48px;border-radius:8px;padding:2px 4px;font-family:var(--num);font-weight:700;font-size:12.5px}
.mx .cell small{display:block;font-size:10px;font-weight:600;opacity:.75}
.tdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}

/* ── 我的投注 ── */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form input,.form select{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);min-width:0;font-size:15px}
.form input:focus,.form select:focus{border-color:var(--accent);outline:0}
.form .wide{grid-column:span 2}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink2);font-size:14px}
.btn{appearance:none;border:0;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn:disabled{opacity:.5}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.del{background:var(--bad-soft);color:var(--bad)}
.formbar{display:flex;gap:12px;align-items:center;margin-top:12px}
.msg{font-size:13px;color:var(--muted)}
.bl select{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:13px}

/* ── 說明 ── */
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.step .no{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--num);font-weight:800;background:var(--soft2);color:var(--muted)}
.step.done .no{background:var(--good-soft);color:var(--good)}
.step.doing .no{background:var(--warn-soft);color:var(--warn)}
.step h4{margin:0;font-size:15.5px}
.step p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.step .st{font-size:12px;font-weight:700;margin-left:8px}
.step.done .st{color:var(--good)} .step.doing .st{color:var(--warn)} .step.wait .st{color:var(--muted)}
.step .track{height:6px;border-radius:999px;background:var(--soft2);overflow:hidden;margin-top:6px;max-width:320px}
.step .track i{display:block;height:100%;background:var(--accent)}
.gl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.gl div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink2)}
.gl b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.feat{display:flex;flex-direction:column;gap:10px}
.feat h5{margin:0 0 5px;font-size:13.5px}
.feat ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.feat li{font-size:12.5px;background:var(--soft);border-radius:8px;padding:2px 8px;color:var(--ink2)}

@media (max-width:640px){
  h1{font-size:21px}
  .kp{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form .wide{grid-column:auto}
  .tm .nm{font-size:15.5px}
  .dot{width:38px;height:38px}
  .tile b{font-size:17px}
  .hide-s{display:none}
  .tb td,.tb th{padding-left:5px;padding-right:5px}
  .tb{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.pc{animation:none}}
</style>

<header class="top"><div class="in">
  <div class="logo"><i><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 13 L7 8 L10 10.5 L15.5 4.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>資金流向</div>
  <nav class="navtop" id="navtop" aria-label="頁面"></nav>
  <div class="upd" id="upd">讀取中…</div>
</div></header>

<main>
  <div class="chips" id="sports" role="group" aria-label="運動"></div>

  <section data-view="board">
    <h1>今日比賽</h1>
    <p class="intro">每場比賽告訴你：<b>大戶的錢押哪一邊</b>（押的人少、錢卻多的那邊），以及在台彩下注划不划算。時間都是台灣時間。</p>
    <div class="ctl">
      <div class="seg mkt" role="group" aria-label="玩法"></div>
      <div class="thr"><label>錢比人多<br>幾 % 算訊號</label><input type="range" class="thrin" min="5" max="30" step="1" aria-label="訊號門檻"><output class="thrv">15%</output></div>
      <button type="button" class="tog" id="only" aria-pressed="false">只看有訊號</button>
    </div>
    <div id="board"></div>
  </section>

  <section data-view="analysis" hidden>
    <h1>訊號準不準</h1>
    <p class="intro">假設每次看板出現訊號，你都跟著下 1 注（用美國收盤賠率），到現在的成績。</p>
    <div class="ctl">
      <div class="seg mkta" role="group" aria-label="玩法"></div>

  // ═════════ 計算（跟 Python 回測一致）═════════
  function sides(g, s, mkt) {

        {key: "home", nm: g.home_zh || g.home_ab, bet: a[0], money: a[1], odds: a[6]},

  const closing = (g) => { const pre = g.snaps.filter((s) => s.hrs == null || s.hrs >= 0); return pre.length ? pre[pre.length - 1] : g.snaps[g.snaps.length - 1]; };
  const latest = (g) => g.snaps[g.snaps.length - 1];

    if (ss.length !== 2 || ss[0].bet == null || ss[1].bet == null) return null;
    const pi = ss[0].bet >= ss[1].bet ? 0 : 1, pub = ss[pi], sharp = ss[1 - pi];

    const first = sides(g, g.snaps[0], mkt)[pi];

    if (mkt === "sp") {
      const openLn = op.sp == null ? first.ln : (pub.key === "away" ? op.sp : -op.sp);
      if (openLn != null && pub.ln != null) lnMove = pub.ln - openLn;
    } else if (mkt === "ou") {
      const openLn = op.ou ?? first.ln;
      if (openLn != null && pub.ln != null) lnMove = pub.key === "over" ? openLn - pub.ln : pub.ln - openLn;
    }
    if (lnMove != null && Math.abs(lnMove) >= 0.5) return lnMove > 0 ? sharp : null;
    const openOdds = mkt === "ml" ? ((op.ml || [])[pi] ?? first.odds) : first.odds;
    if (openOdds == null || pub.odds == null) return null;
    return pub.odds - openOdds >= 0.04 ? sharp : null;
  }
  function clv(g, mkt, thr, key) {
    const cs = sides(g, closing(g), mkt).find((x) => x.key === key);
    for (const s of g.snaps.filter((x) => x.hrs == null || x.hrs >= 0)) {
      const sd = sides(g, s, mkt).find((x) => x.key === key), d = diffOf(sd);
      if (d == null || d < thr) continue;

  // 四分之一盤（例如 -0.25、2.75）拆成兩半各算一次：贏一半／輸一半

  function twDisc(sport, mkt) {

  // ═════════ 圖表 ═════════
  function trend(g, mkt, key, thr, W, H) {
    const vals = g.snaps.map((s) => diffOf(sides(g, s, mkt).find((x) => x.key === key)));

    const path = pts.map((p, j) => (j ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");

  function niceTicks(lo, hi, n) {
    const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }
  function plChart(pts, W, fmt) {
    const H = Math.max(190, Math.min(260, Math.round(W * 0.38))), L = 48, R = 12, T = 12, B = 26;
    const all = [0];
    pts.forEach((p) => { all.push(p.y, p.mean + 2 * p.sd, p.mean - 2 * p.sd); });
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const n = pts.length, x = (i) => L + (i / Math.max(1, n)) * (W - L - R), y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const P = (arr) => arr.map((p) => x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" L");
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="累積賺賠與運氣範圍">`;
    for (const t of niceTicks(lo, hi, 4)) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" fill="var(--muted)" font-size="11" font-family="Nunito,sans-serif" font-weight="700">${fmt(t)}</text>`;
    const up = [[0, 0]].concat(pts.map((p, i) => [i + 1, p.mean + 2 * p.sd])), dn = [[0, 0]].concat(pts.map((p, i) => [i + 1, p.mean - 2 * p.sd])).reverse();
    s += `<path d="M${P(up)} L${P(dn)} Z" fill="var(--band)" fill-opacity=".16"/>`;

    s += `<path d="M${P(lp)}" stroke="${col}" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n)}" cy="${y(last)}" r="4.5" fill="${col}"/>`;
    s += `<text x="${x(0)}" y="${H - 7}" fill="var(--muted)" font-size="11">開始</text><text x="${x(n)}" y="${H - 7}" text-anchor="end" fill="var(--muted)" font-size="11">${esc(pts[n - 1].lab)}</text>`;

  function luckSeries(items) {

    return `<div class="verdict"><b>還在運氣範圍內，分不出是運氣還是實力</b>目前的賺賠，純靠運氣也可能發生。繼續累積就會越來越清楚。${band}</div>`;

  }
  const chartW = (id) => Math.max(300, Math.min(1000, ($(id) && $(id).clientWidth) || 600));

  // ═════════ 今日比賽 ═════════
  function gameCard(g) {

      {s: "done", t: "整理資料", l: "進行中", p: "隊名對照、比分自動回填、讓分正負號校正、缺的盤自動補抓。"},
      {s: "doing", t: "整理成模型用的格式", l: "累積中", p: `每場比賽記下 ${st.n_features ?? "–"} 種每個運動都有的資料，再加上各運動自己特別要看的（投手、門將、背靠背、傷兵…），這些就是「特徵值」。清單在下面。`},
      {s: "doing", t: "訓練模型", l: "足球第一層完成", p: `足球用 2014 年起的歷史（含次級聯賽）做好第一層（成績在下面）。美國四大運動每個至少要 ${goal} 場打完的比賽，現在 ${fin} 場。`, prog: fin / goal},
      {s: "wait", t: "找划算的注", l: "等模型", p: `模型估的勝率 × 台彩賠率 > 1 才建議下。還需要更多台彩賠率記錄（目前 ${twN} 筆）。`},
    ];
    let h = `<div class="card"><h3>我們走到哪一步了</h3><div class="steps">${steps.map((x, i) => `<div class="step ${x.s}"><div class="no">${x.s === "done" ? "✓" : i + 1}</div><div><h4>${x.t}<span class="st">${x.l}</span></h4><p>${x.p}</p>${x.prog != null ? `<div class="track"><i style="width:${Math.min(100, x.prog * 100)}%"></i></div>` : ""}</div></div>`).join("")}</div></div>`;
    const sm = st.soccer_model;
    if (sm && sm.accuracy) {
      const A = sm.accuracy, U = A.uniform.logloss, gain = (x) => (x ? (U - x.logloss) / U * 100 : null);
      const rows = [["只看球隊數據", gain(A.team_only), "var(--band)"],
                    ["賽前賠率（莊家）", gain(A.market), "var(--band)"], ["模型・賽前版", gain(A.model), "var(--accent)"],
                    ["收盤賠率（莊家）", gain(A.closing), "var(--band)"], ["模型・臨場版", gain(A.model_close), "var(--good)"]];
      const mn = Math.min(...rows.map((r) => r[1] ?? 99)), mx = Math.max(...rows.map((r) => r[1] || 0));
      const w = (v) => v == null ? 0 : 8 + (v - mn) / Math.max(0.01, mx - mn) * 92;   // 差距很小，放大看
      const b5 = (sm.betting.avg || {})["0.05"] || {}, t0 = (sm.betting.tw || {})["0.0"] || {}, m0 = (sm.betting.max || {})["0.0"] || {};
      const luck = (r) => r.se != null && Math.abs(r.roi) < 2 * r.se;
      const S = sm.settings || {};
      h += `<div class="card"><h3>足球模型第一層（獨贏）<small>訓練 ${sm.train_games.toLocaleString("en-US")} 場，測試 ${sm.test_games.toLocaleString("en-US")} 場（模型沒看過的 ${esc((sm.test_seasons || []).join("、"))} 季）</small></h3>
        <p class="mut" style="margin:0 0 8px;font-size:13.5px">比「亂猜（主和客各 1/3）」準多少。大家差距都很小，長條有放大：</p>
        ${rows.map(([n, v, c]) => `<div class="mbar"><span>${n}</span><div class="tr"><i style="width:${w(v)}%;background:${c}"></i></div><span class="n">${v == null ? "–" : v.toFixed(2) + "%"}</span></div>`).join("")}
        <div class="gl" style="margin-top:12px">
          <div><b>兩個版本</b>賽前版：開賽前一兩天用，配歐洲各家平均賠率。臨場版：看板更新時，離開賽 3 小時內的比賽自動換成這版，配最新賠率。越接近開賽，傷兵、先發名單都已經反映在賠率裡，所以越準。要在台彩下注，越接近開賽再看越好。</div>
          <div><b>準度</b>賽前版比賽前賠率準一點；臨場版比收盤賠率還準一點點。差距很小，還不能說一定贏過莊家，但至少沒有比較差。</div>
          <div><b>機率很誠實</b>${(sm.calibration || []).slice(4, 6).map((c) => `模型說 ${c.pred}% 的時候，實際開出 ${c.real}%`).join("；")}。說幾成就真的大約幾成。</div>
          <div><b>在歐洲賠率下注：還看不出穩賺</b>用歐洲最高賠率照模型下（${m0.n ?? "–"} 注，大多押和局），投報率 ${m0.roi ?? "–"}%${luck(m0) ? "，還在運氣可以解釋的範圍" : ""}。只挑最有把握的 ${b5.n ?? "–"} 注，注數太少不能當真。</div>
          <div><b>在台彩：幾乎沒有注可以下</b>台彩賠率大約只有歐洲的 9 成，扣掉之後兩季只剩 ${t0.n ?? "–"} 注划算。單靠這一層，在台彩獨贏很難賺。</div>
          <div><b>這一版改了什麼</b>歷史從 5 季加到 ${S.history_from ? "20" + S.history_from.slice(0, 2) + " 年起" : "更多季"}，加入英冠、西乙、義乙、德乙、法乙，升級隊一上來就有合理的強弱分數；多一個看淨勝球的分數（pi-rating）；多一個臨場版。</div>
          <div><b>下一步</b>第二層：等足球資金流向累積，看「錢比人多」能不能再多加一點準度。也要用你記的台彩足球賠率，校正「台彩約歐洲 9 成」這個估計。</div>
        </div></div>`;
    }
    h += `<div class="card"><h3>名詞白話說明</h3><div class="gl">
      <div><b>錢比人多</b>下注金額的 % 減掉下注人數的 %。押的人少、錢卻多，代表下大注的人（常是職業玩家）在這邊。</div>
      <div><b>訊號</b>「錢比人多」超過你設的 %（預設 15%）就算有訊號；再多 10% 以上算「強」。</div>
      <div><b>盤口逆向</b>多數人押 A，但賠率或讓分反而往對 A 有利的方向動。代表莊家收到的大錢其實在另一邊。</div>
      <div><b>美國莊家估計會贏</b>把美國各家賠率裡的抽成拿掉，換算出來的勝率。這是莊家的看法，不是我們的模型。</div>
      <div><b>要贏幾成才不虧</b>1 ÷ 台彩賠率。例如賠率 2.00 要贏 50% 才打平。</div>
      <div><b>運氣範圍</b>假設完全沒本事、只靠運氣，成績 95% 會落在的範圍。跑出這個範圍，才代表可能是實力。</div>
      <div><b>搶到的價錢（CLV）</b>訊號一出現就下，比開賽前才下，賠率好多少。長期是正的＝跟得早有好處。</div>
      <div><b>抽成</b>兩邊賠率倒數加起來 − 1。莊家每收 100 元平均留下多少，越低越好。</div>
      <div><b>特徵值</b>模型拿來判斷的輸入資料，每一種算一個。不是越多越好，太多容易把過去的巧合背起來。</div>
    </div></div>`;
    h += `<div class="card"><h3>每個運動都有的特徵值<small>${st.n_features ?? "–"} 種</small></h3><div class="feat">${(st.features || []).map((f) => `<div><h5>${esc(f.group)}</h5><ul>${f.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div></div>`;
    const sf = st.sport_features || {};
    h += `<div class="card"><h3>各運動特別要看的<small>實線＝已經在收，虛線＝之後再加</small></h3><div class="sf">${Object.values(sf).map((x) => `<div><h5>${esc(x.name)}</h5><p>${esc(x.why)}</p>
      <div class="feat"><ul>${x.have.map((i) => `<li>${esc(i)}</li>`).join("")}${x.plan.map((i) => `<li class="plan">${esc(i)}</li>`).join("")}</ul></div></div>`).join("")}</div></div>`;
    const per = st.per || {};
    h += `<div class="card"><h3>各運動資料量<small>從 ${esc(st.since || "–")} 開始</small></h3><div class="scroll"><table class="tb"><thead><tr><th>運動</th><th class="r">截圖次數</th><th class="r">比賽</th><th class="r">已打完</th></tr></thead><tbody>${Object.entries(per).map(([k, v]) => `<tr><td>${spLabel(k)}</td><td class="r n">${v.snaps}</td><td class="r n">${v.games}</td><td class="r n">${v.finals}${v.history ? `<br><span class="mut" style="font-weight:400;font-size:12px">另有歷史 ${v.history.toLocaleString("en-US")} 場</span>` : ""}</td></tr>`).join("")}</tbody></table></div>
      <p class="mut" style="font-size:13px;margin:10px 0 0">我們不會說「準確率 79%」這種數字。運彩長期能穩定贏 55–58% 就算頂尖；所有成績都附上注數和運氣範圍，讓你自己判斷是實力還是運氣。</p></div>`;
    $("method").innerHTML = h;
  }

  // ═════════ 外框 ═════════
  function renderNav() {
    const icon = (v) => `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">${v.i}</svg>`;
    $("navtop").innerHTML = VIEWS.map((v) => `<button type="button" data-v="${v.k}"${state.view === v.k ? ' aria-current="page"' : ""}>${v.n}</button>`).join("");
    $("tabs").innerHTML = VIEWS.map((v) => `<button type="button" data-v="${v.k}"${state.view === v.k ? ' aria-current="page"' : ""}>${icon(v)}${v.s}</button>`).join("");
    $$("[data-view]").forEach((s) => { s.hidden = s.dataset.view !== state.view; });
    $("sports").hidden = state.view === "method" || state.view === "bets";
  }
  function renderSports() {
    const up = (k) => DATA.games.filter((g) => (k === "all" || g.sport === k) && (g.status === "upcoming" || g.status === "started")).length;
    const keys = ["all", ...Object.keys(DATA.sports)];
    if (!keys.includes(state.sport)) state.sport = "all";
    $("sports").innerHTML = keys.map((k) => `<button type="button" class="chip" data-s="${k}" aria-pressed="${k === state.sport}">${k === "all" ? "全部" : spLabel(k)}<span class="c">${up(k)}</span></button>`).join("");
  }
  function renderUpd() {
    const last = DATA.games.filter(inSport).flatMap((g) => g.snaps.slice(-1).map((x) => x.ts)).sort().pop();
    $("upd").innerHTML = `最後截圖 <b>${last ? when(last) : "–"}</b><span class="hide-s"><br>看板更新 ${when(DATA.generated_utc)}</span>`;
  }
  function renderCtl() {
    $$(".thrin").forEach((i) => { i.value = state.thr; });
    $$(".thrv").forEach((o) => { o.textContent = state.thr + "%"; });
    $("only").setAttribute("aria-pressed", String(state.only));
    $$(".mkt").forEach((el) => { el.innerHTML = ["ml", "sp", "ou"].map((m) => `<button type="button" data-m="${m}" aria-pressed="${state.mkt === m}">${MK[m]}</button>`).join(""); });
    $$(".mkta").forEach((el) => { el.innerHTML = [["all", "全部"], ["ml", "獨贏"], ["sp", "讓分"], ["ou", "大小分"]].map(([k, n]) => `<button type="button" data-am="${k}" aria-pressed="${state.amkt === k}">${n}</button>`).join(""); });
  }
  function render() {
    renderNav(); renderSports(); renderCtl(); renderUpd();
    if (state.view === "board") renderBoard();
    else if (state.view === "analysis") renderAnalysis();
    else if (state.view === "bets") renderBets();
    else if (state.view === "tw") renderTw();
    else renderMethod();
  }
  function go(v) { state.view = v; store.set("view", v); try { history.replaceState(null, "", "#" + v); } catch (e) {} render(); window.scrollTo(0, 0); }

  document.addEventListener("click", async (e) => {
    const t = e.target.closest && e.target.closest("button");
    if (!t || !DATA) return;
    if (t.dataset.v) return go(t.dataset.v);
    if (t.dataset.s) { state.sport = t.dataset.s; store.set("sport", state.sport); return render(); }
    if (t.dataset.m) { state.mkt = t.dataset.m; store.set("mkt", state.mkt); return render(); }
    if (t.dataset.am) { state.amkt = t.dataset.am; store.set("amkt", state.amkt); return render(); }
    if (t.dataset.sort) { const k = t.dataset.sort; state.sort = {k, dir: state.sort.k === k ? -state.sort.dir : -1, open: true}; store.set("sort", state.sort); return renderAnalysis(); }
    if (t.dataset.open) { const k = t.dataset.open; state.open.has(k) ? state.open.delete(k) : state.open.add(k); return renderBoard(); }
    if (t.id === "only") { state.only = !state.only; store.set("only", state.only); return render(); }
    if (t.dataset.act === "del" && DB) {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "確定刪除？"; setTimeout(() => { if (t.isConnected) { t.dataset.confirm = ""; t.textContent = "刪除"; } }, 3500); return; }
      try { await DB.collection("bets").doc(t.closest("tr").dataset.id).delete(); } catch (err) { t.textContent = "刪除失敗"; }
    }
  });
  document.addEventListener("input", (e) => {
    if (!e.target.classList.contains("thrin")) return;
    state.thr = +e.target.value; store.set("thr", state.thr);
    $$(".thrv").forEach((o) => { o.textContent = state.thr + "%"; });
    if (state.view === "board") renderBoard(); else renderAnalysis();
  });
  window.addEventListener("hashchange", () => { const v = hashView(); if (v && v !== state.view) go(v); });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (DATA && (state.view === "analysis" || state.view === "bets")) render(); }, 250); });

  renderNav();
  fetch("data.json", {cache: "no-store"}).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => { DATA = d; render(); })
    .catch(() => { $("upd").textContent = "資料讀取失敗"; $("board").innerHTML = `<div class="empty">讀不到資料。重新整理一次；還是不行就跟 Claude 說「更新看板」。</div>`; });
  initDb();
})();
</script>
