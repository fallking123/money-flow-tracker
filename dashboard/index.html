<title>資金流向看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 看盤終端風格：單一深色主題（刻意的設計，不跟系統切換） */
:root{
  color-scheme:dark;
  --bg:#0B0D10; --panel:#12161B; --panel2:#171C22; --hover:#1B2129; --line:#252C35; --line2:#1B2128;
  --ink:#E7EAEE; --ink2:#B6BEC7; --muted:#76818C; --faint:#4A535D;
  --amber:#F5A524; --amber-soft:#3A2A0E; --cyan:#3DB8F5; --cyan-soft:#0F2A3A;
  --up:#2DD4BF; --up-soft:#0C2F2C; --dn:#FB7185; --dn-soft:#3A1720; --warn:#E9C46A;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --sans:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --tc:"Noto Sans TC","IBM Plex Sans",system-ui,-apple-system,"PingFang TC",sans-serif;
  --side:208px; --tabh:58px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--tc);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mut{color:var(--muted)} .up{color:var(--up)} .dn{color:var(--dn)} .am{color:var(--amber)} .cy{color:var(--cyan)}
a{color:var(--cyan)}

/* ── 頂部 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#07090B;border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:14px;padding:0 16px;height:46px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand b{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.14em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.08em}
.tick{flex:1;min-width:0;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.tick .tr{display:inline-flex;gap:26px;white-space:nowrap;animation:tick 60s linear infinite;padding-left:24px}
.tick:hover .tr{animation-play-state:paused}
.tick .it{font-family:var(--mono);font-size:12px;color:var(--ink2);display:inline-flex;gap:7px;align-items:center}
.tick .it b{color:var(--ink);font-weight:500}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.stat{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.stat i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px var(--up-soft);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ── 版面：iPad/電腦 左側選單，手機 底部分頁 ── */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - 46px)}
.side{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:calc(46px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 46px - env(safe-area-inset-top,0px));overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:7px;cursor:pointer;color:var(--ink2);text-align:left;font-size:14px}
.nav button svg{flex:none;opacity:.8}
.nav button[aria-current="page"]{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--amber)}
.nav button:hover{background:var(--hover)}
.side h6{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);font-weight:500;margin:22px 11px 8px}
.side .kv{font-family:var(--mono);font-size:12px;color:var(--muted);padding:3px 11px;display:flex;justify-content:space-between}
.side .kv b{color:var(--ink2);font-weight:500}
main{padding:18px 22px 60px;min-width:0}
.tabs{display:none}
@media (max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:14px 16px calc(var(--tabh) + 34px + env(safe-area-inset-bottom,0px))}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#07090Bf2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{appearance:none;border:0;background:none;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
  .tabs button[aria-current="page"]{color:var(--amber)}
  .top .stat .lbl{display:none}
  .brand span{display:none}
}

/* ── 共用 ── */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vh h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
.vh p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--amber)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel + .panel,.grid2 + .panel,.panel + .grid2,.kpis + .panel{margin-top:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ph h3{margin:0;font-size:14px;font-weight:600}
.ph small{color:var(--muted);font-size:12px}
.pb{padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;margin-top:14px}
.grid2>.panel{margin-top:0!important}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:999px;padding:5px 13px;font-family:var(--mono);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip .c{color:var(--muted);margin-left:5px}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{appearance:none;border:0;background:none;padding:5px 13px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.thr{display:flex;align-items:center;gap:10px;flex:1;min-width:200px;max-width:320px}
.thr label{font-size:12px;color:var(--muted);white-space:nowrap}
.thr input{flex:1;min-width:0;accent-color:var(--amber)}
.thr output{font-family:var(--mono);font-weight:600;font-size:16px;min-width:4ch;text-align:right;color:var(--amber)}
.tog{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:7px;padding:5px 11px;font-size:13px;cursor:pointer}
.tog[aria-pressed="true"]{border-color:var(--up);color:var(--up);background:var(--up-soft)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px;color:var(--muted);text-align:center;background:var(--panel)}
.note{font-size:12px;color:var(--muted);margin-top:10px;max-width:72ch}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 隊伍徽章（球隊代表色，非官方隊徽） */
.tb{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:22px;padding:0 5px;border-radius:4px;font-family:var(--mono);font-weight:600;font-size:11.5px;letter-spacing:.02em;background:var(--c1,#333);color:var(--tx,#fff);box-shadow:inset 0 -3px 0 var(--c2,#666);flex:none}

/* ── 看盤表 ── */
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted)}
.dayh b{color:var(--ink);font-family:var(--mono);font-weight:500;font-size:13px}
table{border-collapse:collapse;width:100%}
.board{font-size:13px;min-width:660px}
.board th{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.board th.l,.board td.l{text-align:left}
.board td{padding:5px 10px;text-align:right;white-space:nowrap;vertical-align:middle}
tbody.g{cursor:pointer}
tbody.g + tbody tr:first-child td{border-top:1px solid var(--line2)}
tbody.g:hover td{background:var(--hover)}
tr.r1 td{padding-top:10px} tr.r2 td{padding-bottom:10px}
td.tm{width:78px;vertical-align:top;padding-top:11px}
.tm .t{font-family:var(--mono);font-weight:600;font-size:15px;display:block}
.tm .rel,.tm .snap{display:block;font-size:11px;color:var(--muted);font-family:var(--mono)}
.tm .snap{color:var(--faint)}
.tag{display:inline-block;margin-top:5px;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:3px;background:var(--line2);color:var(--muted);font-family:var(--mono)}
.tag.post{background:var(--amber-soft);color:var(--amber)}
.team{display:flex;align-items:center;gap:8px}
.team .zh{color:var(--ink2);font-size:13px}
td.mk{font-family:var(--mono);font-size:13.5px}
td.mk small{color:var(--muted);font-size:11.5px;margin-left:5px}
td.op{color:var(--muted)}
.mv{font-size:9px;margin-left:3px}
.fair{font-family:var(--mono);font-size:13px;color:var(--ink2)}
td.pc{width:84px}
.pcv{font-family:var(--mono);font-size:13.5px}
.bar{height:3px;background:var(--line2);border-radius:2px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%}
.bar.b i{background:var(--amber)} .bar.m i{background:var(--cyan)}
.df{display:inline-block;min-width:46px;text-align:center;font-family:var(--mono);font-weight:600;font-size:13.5px;border-radius:4px;padding:1px 6px;color:var(--muted)}
.df.up{background:var(--up-soft);color:var(--up)} .df.dn{background:var(--dn-soft);color:var(--dn)}
tr.sig .df.up{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--up-soft)}}
tr.sig td.tmn{box-shadow:inset 2px 0 0 var(--up)}
.rv{display:inline-block;font-family:var(--tc);font-size:10px;font-weight:700;color:var(--amber);border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-right:6px;vertical-align:1px}
td.trd{width:108px}
td.trd svg{display:block;width:96px;height:30px;margin-left:auto}
.board td.na{white-space:normal;text-align:left;color:var(--muted);font-size:12px;line-height:1.5}
tbody.det td{background:var(--panel2);padding:14px;text-align:left;white-space:normal}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 22px}
.dgrid h4{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;color:var(--muted)}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line2)}
.mrow:last-child{border-bottom:0}
.pit{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;border-left:3px solid var(--c1,#444);animation:slidein .5s cubic-bezier(.2,.8,.2,1) both}
.pcard:nth-child(2){animation-delay:.08s}
.pcard .nm{font-weight:600;font-size:13.5px}
.pcard .st{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
@keyframes slidein{from{opacity:.001;transform:translateX(14px)}to{opacity:1;transform:none}}
.bigtr svg{width:100%;height:auto;display:block}
.hide-s{}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-weight:600;font-size:22px;line-height:1.25;margin-top:2px}
.kpi .s{font-family:var(--mono);font-size:11px;color:var(--faint)}
.chart{position:relative}
.chart svg{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);padding:0 14px 12px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.verdict{margin:0 14px 14px;padding:11px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:13px}
.verdict b{display:block;font-size:13.5px;margin-bottom:2px}
.verdict.good{border-color:#1E5E57;background:var(--up-soft)} .verdict.good b{color:var(--up)}
.verdict.bad{border-color:#6B2A37;background:var(--dn-soft)} .verdict.bad b{color:var(--dn)}
.verdict .m{font-size:12px;color:var(--ink2)}
.hc{display:flex;flex-direction:column;gap:8px}
.hc .it{border-left:2px solid var(--up);padding:7px 11px;background:var(--panel2);border-radius:0 6px 6px 0;font-size:13px}
.hc .it.w{border-left-color:var(--dn)}
.hc .it b{font-weight:600}
.hc .it .m{font-size:12px;color:var(--muted)}
.dt{font-size:13px;min-width:100%}
.dt th{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.dt th.r,.dt td.r{text-align:right}
.dt td{padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr:hover td{background:var(--hover)}
.dt th button{appearance:none;border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit}
.dt th button[data-dir="1"]::after{content:" ▲";font-size:8px}
.dt th button[data-dir="-1"]::after{content:" ▼";font-size:8px}
.lowN{font-size:10px;color:var(--faint);margin-left:4px}
.res{font-weight:700;font-size:11.5px;padding:1px 6px;border-radius:3px}
.res.w{background:var(--up-soft);color:var(--up)} .res.l{background:var(--dn-soft);color:var(--dn)} .res.p{background:var(--line2);color:var(--muted)}
.dt.mini td,.dt.mini th{padding:4px 6px;font-size:12px}
.dt.mini{min-width:0}
.mx td,.mx th{text-align:center!important;padding:6px 6px!important}
.mx .cell{display:inline-block;min-width:46px;border-radius:4px;padding:2px 4px;font-family:var(--mono);font-size:12px}
.mx .cell small{display:block;font-size:9.5px;opacity:.7}
.mx .sp th{border-bottom:0}
.dotc{color:var(--faint)}

/* ── 我的投注 ── */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form input,.form select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink);min-width:0;font-size:14px}
.form input:focus,.form select:focus{border-color:var(--amber);outline:0}
.form .wide{grid-column:span 2}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.btn{appearance:none;border:0;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--amber);color:#1A1204}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink2);font-weight:500}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.del{border-color:#6B2A37;color:var(--dn)}
.btn:disabled{opacity:.5;cursor:default}
.formbar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.msg{font-size:12.5px;color:var(--muted)}
.bl select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 4px;font-size:12px}

/* ── 方法 ── */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:relative;min-width:0}
.step .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step h4{margin:4px 0 4px;font-size:15px}
.step p{margin:0;font-size:12.5px;color:var(--ink2)}
.step .stt{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px}
.step.done{border-color:#1E5E57} .step.done .stt{background:var(--up-soft);color:var(--up)}
.step.doing{border-color:#6A4A12} .step.doing .stt{background:var(--amber-soft);color:var(--amber)}
.step.wait .stt{background:var(--line2);color:var(--muted)}
.step .prog{height:4px;background:var(--line2);border-radius:2px;margin-top:9px;overflow:hidden}
.step .prog i{display:block;height:100%;background:var(--amber)}
@media (max-width:760px){.pipe{grid-template-columns:1fr}}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.feat h5{margin:0 0 6px;font-size:13px}
.feat ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.feat li{font-size:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:2px 7px;color:var(--ink2)}
.prose{max-width:70ch;font-size:13.5px;color:var(--ink2)}
.prose p{margin:0 0 10px}
.prose b{color:var(--ink)}

@media (max-width:640px){
  .kpis{--cols:2!important}
  .kpi .v{font-size:19px}
  .hide-s{display:none}
  .board{min-width:0}
  .board td,.board th{padding-left:6px;padding-right:6px}
  td.tm{width:60px}
  .team .zh{display:none}
  td.pc{width:auto}
  .form .wide{grid-column:auto}
  .vh h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  .tick .tr{animation:none}
  .pcard,tr.sig .df.up,.stat i{animation:none}
}
</style>

<header class="top">
  <div class="row">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="none" stroke="#F5A524" stroke-width="1.6"/><path d="M5 15 L9 10 L12 12.5 L17 6.5" stroke="#3DB8F5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>FLOW</b><span>資金流向</span>
    </div>
    <div class="tick" aria-label="目前差距最大的比賽"><div class="tr" id="ticker"></div></div>
    <div class="stat"><i></i><span class="lbl">最後截圖</span><span id="upd">讀取中…</span></div>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <nav class="nav" id="nav" aria-label="頁面"></nav>
    <h6>資料量</h6>
    <div id="sidestats"></div>
  </aside>
  <main id="main">
    <div class="chips" id="sports" role="group" aria-label="運動"></div>

    <section data-view="board">
      <div class="vh"><div><div class="eyebrow">MARKET BOARD</div><h1>即將開賽</h1><p>台灣時間。賠率為美國各家中間值（小數賠率）。點比賽看投手、台彩打平門檻與走勢。</p></div></div>
      <div class="ctl">
        <div class="seg mkt" role="group" aria-label="盤別"></div>
        <div class="thr"><label>訊號門檻</label><input type="range" class="thrin" min="5" max="30" step="1" aria-label="訊號門檻"><output class="thrv">15%</output></div>
        <button type="button" class="tog" id="only" aria-pressed="false">只看有訊號</button>
      </div>
      <div id="board"></div>
    </section>

    <section data-view="analysis" hidden>
      <div class="vh"><div><div class="eyebrow">SIGNAL ANALYTICS</div><h1>數據分析</h1><p id="ansub"></p></div></div>
      <div class="ctl">
        <div class="seg mkta" role="group" aria-label="盤別"></div>

<script>
(() => {
  // ═════════ 基本設定 ═════════
  const MK = {ml: "獨贏", sp: "讓分", ou: "大小分"};
  const SIDE = {away: "客", home: "主", over: "大", under: "小"};
  const SEASON = {preseason: "季前", postseason: "季後賽"};
  const TZ = "Asia/Taipei";
  const fmtDay = new Intl.DateTimeFormat("zh-TW", {timeZone: TZ, month: "numeric", day: "numeric", weekday: "short"});
  const fmtTime = new Intl.DateTimeFormat("zh-TW", {timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false});
  const fmtMD = new Intl.DateTimeFormat("zh-TW", {timeZone: TZ, month: "numeric", day: "numeric"});
  const fmtWd = new Intl.DateTimeFormat("zh-TW", {timeZone: TZ, weekday: "short"});
  const fmtISO = new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"});
  const snapLabel = (ts) => { const x = new Date(ts); return (fmtMD.format(x) === fmtMD.format(new Date()) ? "" : fmtMD.format(x) + " ") + fmtTime.format(x); };
  const $ = (id) => document.getElementById(id);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("flow:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("flow:" + k, JSON.stringify(v)); } catch (e) {} },

  const VIEWS = [
    {k: "board", n: "看盤", i: '<path d="M3 17V7m5 10V4m5 13v-7m5 7V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>'},
    {k: "analysis", n: "數據分析", i: '<path d="M3 16l5-5 3 3 6-7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 19h16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'},
    {k: "bets", n: "我的投注", i: '<rect x="4" y="3" width="13" height="16" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M7.5 8h6M7.5 11.5h6M7.5 15h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'},
    {k: "tw", n: "台彩對照", i: '<circle cx="11" cy="11" r="7.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M8 11h6M11 8v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'},
    {k: "method", n: "方法", i: '<path d="M4 6h14M4 11h14M4 16h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'},
  ];
  const hashView = () => { const h = (location.hash || "").slice(1); return VIEWS.some((v) => v.k === h) ? h : null; };
  const state = {view: hashView() || store.get("view", "board"), sport: store.get("sport", "all"), thr: store.get("thr", 15),
                 mkt: store.get("mkt", "ml"), amkt: store.get("amkt", "all"), only: store.get("only", false),
                 sort: store.get("sort", {k: "t", dir: -1}), open: new Set()};
  let DATA = null, BETS = [], DB = null, dbState = "loading";

  const pct = (v) => (v == null ? "–" : Math.round(v) + "%");
  const odd = (v) => (v == null ? "–" : Number(v).toFixed(2));
  const line = (v) => (v == null ? "–" : (v > 0 ? "+" : "") + v);
  const sgn = (v, dp) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(dp);
  const cls = (v) => (v > 0 ? "up" : v < 0 ? "dn" : "");
  const ntd = (v) => (v < 0 ? "−" : v > 0 ? "+" : "") + Math.abs(Math.round(v)).toLocaleString("en-US");

  // 隊伍徽章：球隊代表色 + 縮寫（依底色自動選黑/白字）
  function badge(ab, c) {
    const [c1, c2] = c || ["#2A3139", "#4A535D"];
    const h = c1.replace("#", ""), r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const tx = (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111" : "#fff";
    return `<span class="tb" style="--c1:${c1};--c2:${c2};--tx:${tx}">${esc(ab || "?")}</span>`;
  }

  // ═════════ 計算（跟 Python 回測一致）═════════
  function sides(g, s, mkt) {
    const a = (s && s[mkt]) || [];
    if (mkt === "ml") return [
      {key: "away", nm: g.away_zh || g.away_ab, bet: a[0], money: a[1], odds: a[4]},
      {key: "home", nm: g.home_zh || g.home_ab, bet: a[2], money: a[3], odds: a[5]}];
    if (mkt === "sp") return [
      {key: "away", nm: g.away_zh || g.away_ab, bet: a[0], money: a[1], odds: a[5], ln: a[4]},
      {key: "home", nm: g.home_zh || g.home_ab, bet: a[2], money: a[3], odds: a[6], ln: a[4] == null ? null : -a[4]}];
    return [
      {key: "over", nm: "大分", bet: a[0], money: a[1], odds: a[5], ln: a[4]},
      {key: "under", nm: "小分", bet: a[2], money: a[3], odds: a[6], ln: a[4]}];
  }
  const diffOf = (sd) => (sd.bet == null || sd.money == null ? null : sd.money - sd.bet);
  // 去水公平機率：兩邊賠率倒數，各自除以總和（把莊家抽成拿掉）
  function fair(ss, i) {
    const a = ss[0].odds, b = ss[1].odds;
    if (!a || !b) return null;
    const ia = 1 / a, ib = 1 / b;
    return (i === 0 ? ia : ib) / (ia + ib);
  }
  function signal(g, s, mkt, thr) {
    const ss = sides(g, s, mkt);
    for (let i = 0; i < 2; i++) { const sd = ss[i], d = diffOf(sd); if (d != null && d >= thr) return {...sd, diff: d, fair: fair(ss, i)}; }
    return null;
  }
  const closing = (g) => { const pre = g.snaps.filter((s) => s.hrs == null || s.hrs >= 0); return pre.length ? pre[pre.length - 1] : g.snaps[g.snaps.length - 1]; };
  const latest = (g) => g.snaps[g.snaps.length - 1];
  function rlm(g, mkt) {
    const ss = sides(g, closing(g), mkt);
    if (ss[0].bet == null || ss[1].bet == null) return null;
    const pi = ss[0].bet >= ss[1].bet ? 0 : 1, pub = ss[pi], sharp = ss[1 - pi];
    if (pub.bet < 55) return null;
    const first = sides(g, g.snaps[0], mkt)[pi];
    const op = g.open || {};
    let lnMove = null;
    if (mkt === "sp") {
      const openLn = op.sp == null ? first.ln : (pub.key === "away" ? op.sp : -op.sp);
      if (openLn != null && pub.ln != null) lnMove = pub.ln - openLn;
    } else if (mkt === "ou") {
      const openLn = op.ou ?? first.ln;
      if (openLn != null && pub.ln != null) lnMove = pub.key === "over" ? openLn - pub.ln : pub.ln - openLn;
    }
    if (lnMove != null && Math.abs(lnMove) >= 0.5) return lnMove > 0 ? sharp : null;
    const openOdds = mkt === "ml" ? (op.ml || [])[pi] : first.odds;
    if (openOdds == null || pub.odds == null) return null;
    return pub.odds - openOdds >= 0.04 ? sharp : null;
  }
  function clv(g, mkt, thr, key) {
    const cs = sides(g, closing(g), mkt).find((x) => x.key === key);
    for (const s of g.snaps.filter((x) => x.hrs == null || x.hrs >= 0)) {
      const sd = sides(g, s, mkt).find((x) => x.key === key), d = diffOf(sd);
      if (d == null || d < thr) continue;
      if (sd.odds == null || cs.odds == null || (mkt !== "ml" && sd.ln !== cs.ln)) return null;
      return (sd.odds / cs.odds - 1) * 100;
    }
    return null;
  }
  function settle(g, sd, mkt) {
    const r = g.result; if (!r || sd.odds == null) return null;
    let o;
    if (mkt === "ml") o = r.winner === "tie" ? 0 : (r.winner === sd.key ? 1 : -1);
    else if (mkt === "sp") {
      if (sd.ln == null) return null;
      const m = sd.key === "away" ? r.away + sd.ln - r.home : r.home + sd.ln - r.away;
      o = m > 0 ? 1 : m < 0 ? -1 : 0;
    } else {
      if (sd.ln == null) return null;
      const m = r.total - sd.ln;
      o = sd.key === "over" ? Math.sign(m) : -Math.sign(m);
    }
    return {o, pl: o > 0 ? sd.odds - 1 : o < 0 ? -1 : 0};
  }
  const inSport = (g) => state.sport === "all" || g.sport === state.sport;
  // 台彩估計賠率：美國賠率 × (1 + 這個運動/盤別的平均折扣)；沒記錄就用全部平均
  function twDisc(sport, mkt) {
    const gs = (DATA.tw && DATA.tw.by_group) || [];
    const hit = gs.find((x) => x.sport === sport && x.market === mkt && x.avg_discount_pct != null);
    if (hit) return {d: hit.avg_discount_pct, est: false};
    const all = gs.filter((x) => x.avg_discount_pct != null);
    return all.length ? {d: all.reduce((s, x) => s + x.avg_discount_pct, 0) / all.length, est: true} : null;
  }
  const twMargin = () => {
    const gs = ((DATA.tw && DATA.tw.by_group) || []).filter((x) => x.tw_margin_pct != null);
    return gs.length ? gs.reduce((s, x) => s + x.tw_margin_pct, 0) / gs.length / 100 : 0.15;
  };

  // ═════════ 圖表 ═════════
  function trend(g, mkt, key, thr, W, H) {
    const vals = g.snaps.map((s) => diffOf(sides(g, s, mkt).find((x) => x.key === key)));
    const pts = vals.map((v, i) => [i, v]).filter((p) => p[1] != null);
    if (pts.length < 2) return "";
    const lo = Math.min(-thr - 5, ...pts.map((p) => p[1])), hi = Math.max(thr + 5, ...pts.map((p) => p[1]));
    const x = (i) => 2 + (i / (vals.length - 1)) * (W - 4), y = (v) => 2 + (1 - (v - lo) / (hi - lo)) * (H - 4);
    const path = pts.map((p, j) => (j ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    const col = last[1] >= thr ? "var(--up)" : last[1] <= -thr ? "var(--dn)" : "var(--muted)";
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="差距走勢，最新 ${Math.round(last[1])}">
      <rect x="0" y="${y(hi)}" width="${W}" height="${Math.max(0, y(thr) - y(hi))}" fill="var(--up-soft)"/>
      <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="${path}" stroke="${col}" stroke-width="1.8" fill="none" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <circle cx="${x(last[0])}" cy="${y(last[1])}" r="2.4" fill="${col}"/></svg>`;
  }
  function niceTicks(lo, hi, n) {
    const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }
  // 累積損益線 + 運氣帶（±2 個標準差）。pts: [{y, mean, sd, lab}]
  function plChart(pts, W, unitFmt) {
    const H = Math.max(200, Math.min(280, Math.round(W * 0.36))), L = 50, R = 14, T = 14, B = 26;
    const all = [0];
    pts.forEach((p) => { all.push(p.y, p.mean + 2 * p.sd, p.mean - 2 * p.sd); });
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const n = pts.length;
    const x = (i) => L + (i / Math.max(1, n)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const ticks = niceTicks(lo, hi, 4);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="累積損益與運氣帶">`;
    for (const t of ticks) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 ? "var(--faint)" : "var(--line2)"}" stroke-width="1"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-size="10.5">${unitFmt(t)}</text>`;
    const up = [[0, 0]].concat(pts.map((p, i) => [i + 1, p.mean + 2 * p.sd])), dn = [[0, 0]].concat(pts.map((p, i) => [i + 1, p.mean - 2 * p.sd]));
    s += `<path d="M${up.map((p) => x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" L")} L${dn.reverse().map((p) => x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" L")} Z" fill="#76818C" fill-opacity=".14" stroke="none"/>`;
    s += `<path d="M${[[0, 0]].concat(pts.map((p, i) => [i + 1, p.mean])).map((p) => x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" L")}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4" fill="none"/>`;
    const lp = [[0, 0]].concat(pts.map((p, i) => [i + 1, p.y]));
    const last = lp[lp.length - 1][1];
    const col = last >= 0 ? "var(--up)" : "var(--dn)";
    s += `<path d="M${lp.map((p) => x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" L")}" stroke="${col}" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
    s += `<circle cx="${x(n)}" cy="${y(last)}" r="3.5" fill="${col}"/>`;
    if (n) {
      s += `<text x="${x(0)}" y="${H - 8}" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-size="10.5">起點</text>`;
      s += `<text x="${x(n)}" y="${H - 8}" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono,monospace" font-size="10.5">${esc(pts[n - 1].lab)}</text>`;
    }
    return s + "</svg>";
  }
  // 運氣帶：假設完全沒本事（勝率＝市場公平機率），累積損益的期望與標準差
  function luckSeries(items) {
    let cy = 0, cm = 0, cv = 0;
    return items.map((it) => {
      cy += it.pl; cm += it.p * it.odds * it.stake - it.stake; cv += it.p * (1 - it.p) * Math.pow(it.odds * it.stake, 2);
      return {y: cy, mean: cm, sd: Math.sqrt(cv), lab: it.lab};
    });
  }
  function verdictBox(series, unitFmt) {
    if (series.length < 5) return `<div class="verdict"><b>樣本太少，還看不出來</b><span class="m">至少要 5 筆已結算才畫運氣帶；30 筆以上比較有參考價值。</span></div>`;
    const l = series[series.length - 1], z = l.sd ? (l.y - l.mean) / l.sd : 0;
    const band = `實際 ${unitFmt(l.y)}　運氣帶 ${unitFmt(l.mean - 2 * l.sd)} ～ ${unitFmt(l.mean + 2 * l.sd)}　偏離 ${sgn(z, 2)}σ`;
    if (z > 2) return `<div class="verdict good"><b>高於運氣帶：可能有真的優勢</b>成績跑到純運氣解釋不了的地方。樣本越多越可信，先別急著加碼。<div class="m">${band}</div></div>`;
    if (z < -2) return `<div class="verdict bad"><b>低於運氣帶：不只是運氣差</b>輸得比純運氣還多，這個方法（或下注方式）可能本身就在虧。<div class="m">${band}</div></div>`;
    return `<div class="verdict"><b>在運氣帶內：目前分不出是運氣還是實力</b>成績還在「純運氣」可能出現的範圍，繼續累積。<div class="m">${band}</div></div>`;
  }
  function streaks(outs) {
    let w = 0, l = 0, cw = 0, cl = 0;
    for (const o of outs) { if (o > 0) { cw++; cl = 0; } else if (o < 0) { cl++; cw = 0; } w = Math.max(w, cw); l = Math.max(l, cl); }
    return {w, l};
  }
  function maxDD(pls) {
    let c = 0, peak = 0, dd = 0;
    for (const p of pls) { c += p; peak = Math.max(peak, c); dd = Math.max(dd, peak - c); }
    return dd;
  }
  // 分組統計表
  function groupTable(title, rows, keyFn, fmtPL, minN) {
    const m = new Map();
    for (const r of rows) { const k = keyFn(r); if (k == null) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
    let h = `<div class="panel"><div class="ph"><h3>${title}</h3></div><div class="scroll"><table class="dt"><thead><tr><th>項目</th><th class="r">筆數</th><th class="r">勝率</th><th class="r">損益</th><th class="r">ROI</th></tr></thead><tbody>`;
    if (!m.size) h += `<tr><td colspan="5" class="mut">還沒有資料</td></tr>`;
    const list = [...m.entries()].map(([k, rs]) => {
      const w = rs.filter((r) => r.o > 0).length, l = rs.filter((r) => r.o < 0).length, pl = rs.reduce((s, r) => s + r.pl, 0), st = rs.reduce((s, r) => s + r.stake, 0);
      return {k, n: rs.length, wr: w + l ? w / (w + l) : null, pl, roi: st ? pl / st * 100 : null};
    }).sort((a, b) => b.n - a.n);
    for (const g of list) {
      h += `<tr><td>${esc(g.k)}${g.n < minN ? `<span class="lowN">樣本少</span>` : ""}</td><td class="r m">${g.n}</td><td class="r m">${g.wr == null ? "–" : Math.round(g.wr * 100) + "%"}</td>
        <td class="r m ${cls(g.pl)}">${fmtPL(g.pl)}</td><td class="r m ${cls(g.roi)}">${g.roi == null ? "–" : sgn(g.roi, 1) + "%"}</td></tr>`;
    }
    return {html: h + `</tbody></table></div></div>`, list};
  }
  function healthCheck(groups, overall, minN) {
    const items = [];
    for (const [dim, list] of groups) for (const g of list) {
      if (g.n < minN || g.roi == null || overall == null) continue;
      const d = g.roi - overall;
      if (Math.abs(d) >= 8) items.push({dim, g, d});
    }
    items.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    if (!items.length) return `<div class="mut" style="font-size:13px">目前沒有明顯比平均好或差的分類（每類至少 ${minN} 筆、ROI 差 8 個百分點以上才列出）。</div>`;
    return `<div class="hc">${items.slice(0, 6).map(({dim, g, d}) => `<div class="it ${d < 0 ? "w" : ""}"><b>${d > 0 ? "比平均好" : "比平均差"}・${esc(dim)}「${esc(g.k)}」</b>
      <div class="m">${g.n} 筆　勝率 ${g.wr == null ? "–" : Math.round(g.wr * 100) + "%"}　ROI ${sgn(g.roi, 1)}%（平均 ${sgn(overall, 1)}%）</div></div>`).join("")}</div>`;
  }
  const chartW = (id) => Math.max(300, Math.min(900, ($(id) && $(id).clientWidth) || 600) - 2);

  // ═════════ 看盤 ═════════
  function mkCell(g, sd, mkt, i, isOpen) {
    const op = g.open || {};
    if (mkt === "ml") {
      if (isOpen) return odd((op.ml || [])[i]);
      const o = (op.ml || [])[i], mv = o != null && sd.odds != null ? sd.odds - o : 0;
      return `${odd(sd.odds)}${Math.abs(mv) >= 0.02 ? `<span class="mv ${mv > 0 ? "up" : "dn"}">${mv > 0 ? "▲" : "▼"}</span>` : ""}`;
    }
    if (mkt === "sp") {
      const oln = op.sp == null ? null : (i === 0 ? op.sp : -op.sp);

  function gameRows(g) {

  function detail(g) {

  function allFinal() {

    for (const g of DATA.closed || []) if (!map.has(g.sport + "|" + g.id)) map.set(g.sport + "|" + g.id, g);

  }
  function sigRows() {

    for (const g of allFinal()) {
      if (!inSport(g)) continue;
      for (const mkt of mkts) {
        const sig = signal(g, closing(g), mkt, thr);
        if (!sig) continue;
        const r = settle(g, sig, mkt);
        if (!r) continue;
        const rv = rlm(g, mkt);
        rows.push({g, mkt, sig, o: r.o, pl: r.pl, stake: 1, odds: sig.odds, p: sig.fair ?? 1 / sig.odds,
                   rev: rv ? (rv.key === sig.key ? 1 : -1) : 0, clv: clv(g, mkt, thr, sig.key), t: g.t});
      }
    }
    return rows.sort((a, b) => (a.t < b.t ? -1 : 1));
  }

  async function initDb() {

    if (!DB) { dbState = "off"; if (DATA && state.view === "bets") renderBets(); return; }
    dbState = "on";
    DB.collection("bets").onSnapshot((snap) => {
      BETS = snap.docs.map((d) => ({id: d.id, ...d.data()}));
      if (DATA && state.view === "bets" && !document.activeElement?.closest?.("#bf")) renderBets();

  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "bf") return;
    e.preventDefault();
    if (!DB) return;
    const f = new FormData(e.target), odds = parseFloat(f.get("odds")), stake = parseFloat(f.get("stake"));
    if (!(odds > 1) || !(stake > 0)) { $("bmsg").textContent = "賠率要大於 1、金額要大於 0"; return; }
    const b = {date: f.get("date"), league: f.get("league"), match: (f.get("match") || "").trim(), market: f.get("market"),
               pick: (f.get("pick") || "").trim(), legs: parseInt(f.get("legs"), 10) || 1, odds, stake, result: f.get("result"),
               signal: f.get("signal") === "on", created: new Date().toISOString()};
    $("bsave").disabled = true; $("bmsg").textContent = "儲存中…";
    try { await DB.collection("bets").add(b); e.target.reset(); e.target.date.value = fmtISO.format(new Date()); $("bmsg").textContent = "已新增"; renderBets(); }
    catch (err) { $("bmsg").textContent = err && err.code === "quota_exceeded" ? "紀錄已滿，請刪掉一些舊注單" : "儲存失敗，稍後再試"; }

  document.addEventListener("change", async (e) => {
    const sel = e.target.closest && e.target.closest('[data-act="res"]'); if (!sel || !DB) return;

  // ═════════ 方法與進度 ═════════

    const steps = [
      {n: "01", t: "抓取數據", p: `資金流向每 10 分鐘到 6 小時一次，另外抓賽果、每局比分、天氣、先發投手。目前 ${st.snaps ?? 0} 筆截圖、${st.games ?? 0} 場比賽。`, s: "done", l: "運作中"},
      {n: "02", t: "數據清理", p: "隊名對照（SBD↔ESPN）、賽果自動回填、主客讓分正負號校正、缺盤補抓。", s: "done", l: "運作中"},
      {n: "03", t: "特徵整理", p: `每場比賽記下 ${st.n_features ?? "–"} 個特徵（下方列表），存成之後訓練模型用的格式。`, s: "doing", l: "持續累積"},
      {n: "04", t: "模型訓練", p: `用已完賽比賽訓練、再用沒看過的比賽驗證。至少要 ${goal} 場已完賽才開始，現在 ${fin} 場。`, s: "wait", l: `${Math.min(100, Math.round(fin / goal * 100))}%`, prog: fin / goal},

    $("only").setAttribute("aria-pressed", String(state.only));
    $$(".mkt").forEach((el) => { el.innerHTML = ["ml", "sp", "ou"].map((m) => `<button type="button" data-m="${m}" aria-pressed="${state.mkt === m}">${MK[m]}</button>`).join(""); });
    $$(".mkta").forEach((el) => { el.innerHTML = [["all", "全部"], ["ml", "獨贏"], ["sp", "讓分"], ["ou", "大小分"]].map(([k, n]) => `<button type="button" data-am="${k}" aria-pressed="${state.amkt === k}">${n}</button>`).join(""); });
  }
  function render() {
    renderNav(); renderSports(); renderCtl();
    if (state.view === "board") renderBoard();
    else if (state.view === "analysis") renderAnalysis();
    else if (state.view === "bets") renderBets();
    else if (state.view === "tw") renderTw();
    else renderMethod();
  }
  function go(v) { state.view = v; store.set("view", v); try { history.replaceState(null, "", "#" + v); } catch (e) {} render(); window.scrollTo(0, 0); }

  document.addEventListener("click", (e) => {
    const t = e.target.closest && e.target.closest("button,tbody.g");
    if (!t || !DATA) return;
    if (t.dataset.v) return go(t.dataset.v);
    if (t.dataset.s) { state.sport = t.dataset.s; store.set("sport", state.sport); return render(); }
    if (t.dataset.m) { state.mkt = t.dataset.m; store.set("mkt", state.mkt); return render(); }
    if (t.dataset.am) { state.amkt = t.dataset.am; store.set("amkt", state.amkt); return render(); }
    if (t.dataset.sort) { const k = t.dataset.sort; state.sort = {k, dir: state.sort.k === k ? -state.sort.dir : -1}; store.set("sort", state.sort); return renderAnalysis(); }
    if (t.id === "only") { state.only = !state.only; store.set("only", state.only); return render(); }
    if (t.matches("tbody.g")) { const k = t.dataset.k; state.open.has(k) ? state.open.delete(k) : state.open.add(k); return renderBoard(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const tb = e.target.closest && e.target.closest("tbody.g"); if (!tb) return;
    e.preventDefault(); const k = tb.dataset.k; state.open.has(k) ? state.open.delete(k) : state.open.add(k); renderBoard();
  });
  document.addEventListener("input", (e) => {
    if (!e.target.classList.contains("thrin")) return;
    state.thr = +e.target.value; store.set("thr", state.thr);
    $$(".thrv").forEach((o) => { o.textContent = state.thr + "%"; });
    if (state.view === "board") renderBoard(); else renderAnalysis();
  });
  window.addEventListener("hashchange", () => { const v = hashView(); if (v && v !== state.view) go(v); });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (DATA && (state.view === "analysis" || state.view === "bets")) render(); }, 250); });

  renderNav();
  fetch("data.json", {cache: "no-store"}).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => { DATA = d; renderTicker(); render(); })
    .catch(() => { $("upd").textContent = "資料讀取失敗"; $("board").innerHTML = `<div class="empty">讀不到資料檔。重新整理一次；還是不行就跟 Claude 說「更新看板」。</div>`; });
  initDb();
})();
</script>
